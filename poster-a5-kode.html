<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poster Dinding A5 (Layout 4 IG Stack) — HIMA Informatika</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@700;800;900&family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #081426;
        }
        .workspace-stage {
            background-color: #081426;
            background-image: radial-gradient(rgba(56, 189, 248, 0.16) 1.2px, transparent 1.2px);
            background-size: 20px 20px;
        }
        .btn-brutal {
            transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.12s ease;
        }
        .btn-brutal:hover { transform: translate(-1px, -1px); }
        .btn-brutal:active { transform: translate(2px, 2px); box-shadow: none !important; }
        .builder-scroll::-webkit-scrollbar { width: 6px; }
        .builder-scroll::-webkit-scrollbar-track { background: #0B192E; }
        .builder-scroll::-webkit-scrollbar-thumb { background: #2A82C6; }
        .a5-svg-host svg {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body class="h-screen overflow-hidden bg-[#081426] text-white flex">

    <!-- MOBILE SIDEBAR BACKDROP -->
    <div id="mobileBackdrop" onclick="toggleMobileSidebar(false)" class="fixed inset-0 z-30 bg-black/60 hidden lg:hidden"></div>

    <!-- LEFT LIVE STUDIO SIDEBAR -->
    <aside id="builderSidebar" class="fixed lg:static inset-y-0 left-0 z-40 w-[345px] xl:w-[370px] bg-[#0F233C] border-r-[3px] border-black flex flex-col shrink-0 -translate-x-full lg:translate-x-0 transition-transform duration-200">

        <!-- Brand Header -->
        <div class="h-16 px-4 bg-[#0B192E] border-b-[3px] border-black flex items-center justify-between shrink-0">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 bg-white border-2 border-black p-1 shadow-[2px_2px_0_#000000] shrink-0 flex items-center justify-center">
                    <img id="sidebarLogo" alt="HIMA IF" class="w-full h-full object-contain">
                </div>
                <div class="min-w-0">
                    <span class="text-sm font-extrabold uppercase tracking-wider text-white block leading-none">
                        Poster A5 Studio
                    </span>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-[#38BDF8] block mt-1 leading-none">
                        Layout 4 IG Stack • 300 DPI
                    </span>
                </div>
            </div>

            <button type="button" onclick="toggleMobileSidebar(false)" class="lg:hidden px-2.5 py-1 bg-white text-black border-2 border-black text-xs font-extrabold cursor-pointer">
                ✕
            </button>
        </div>

        <!-- Scrollable Live Controls -->
        <div class="builder-scroll flex-1 overflow-y-auto p-4 space-y-5">

            <!-- 0. PILIH BINGKAI EDIT -->
            <div class="space-y-2">
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-extrabold uppercase tracking-wider text-[#93C5FD]">0. Bingkai Aktif</span>
                    <span id="lblActiveFrameMeta" class="text-[10px] font-mono text-[#FCD34D]">Slide 1 / 3</span>
                </div>
                <div class="grid grid-cols-3 gap-1.5">
                    <button type="button" onclick="selectActiveFrame(1)" id="btn-frame-1" class="btn-brutal py-2 px-2 bg-[#FCD34D] text-black border-2 border-black shadow-[3px_3px_0_#000000] text-center cursor-pointer">
                        <span class="text-[11px] font-extrabold uppercase block">Bingkai 1</span>
                        <span class="text-[9px] font-mono font-bold opacity-80 block mt-0.5">● ○ ○</span>
                    </button>
                    <button type="button" onclick="selectActiveFrame(2)" id="btn-frame-2" class="btn-brutal py-2 px-2 bg-[#162C4E] text-white border-2 border-black shadow-[3px_3px_0_#000000] text-center cursor-pointer">
                        <span class="text-[11px] font-extrabold uppercase block">Bingkai 2</span>
                        <span class="text-[9px] font-mono font-bold opacity-80 block mt-0.5">○ ● ○</span>
                    </button>
                    <button type="button" onclick="selectActiveFrame(3)" id="btn-frame-3" class="btn-brutal py-2 px-2 bg-[#162C4E] text-white border-2 border-black shadow-[3px_3px_0_#000000] text-center cursor-pointer">
                        <span class="text-[11px] font-extrabold uppercase block">Bingkai 3</span>
                        <span class="text-[9px] font-mono font-bold opacity-80 block mt-0.5">○ ○ ●</span>
                    </button>
                </div>
            </div>

            <!-- 1. TEMA WARNA LAYOUT 4 -->
            <div class="space-y-2 pt-3 border-t-2 border-white/10">
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-extrabold uppercase tracking-wider text-[#93C5FD]">1. Tema Layout 4</span>
                    <button type="button" onclick="toggleSyncThemes()" id="btnSyncTheme" class="px-2 py-0.5 border border-black text-[9.5px] font-extrabold uppercase cursor-pointer">
                        Seragam 3 Set
                    </button>
                </div>
                <div class="grid grid-cols-1 gap-1.5">
                    <button type="button" onclick="applyL4Theme('neubrutalism')" id="btn-thm-neubrutalism" class="thm-btn btn-brutal px-3 py-2 bg-[#FCD34D] text-black border-2 border-black shadow-[3px_3px_0_#000] flex items-center justify-between cursor-pointer">
                        <span class="text-[11px] font-extrabold uppercase">Neubrutalism HIMA IF</span>
                        <span class="flex gap-1"><span class="w-3.5 h-3.5 bg-[#16488E] border border-black"></span><span class="w-3.5 h-3.5 bg-[#FFFFFF] border border-black"></span><span class="w-3.5 h-3.5 bg-[#CA2C2A] border border-black"></span></span>
                    </button>
                    <button type="button" onclick="applyL4Theme('dark-code')" id="btn-thm-dark-code" class="thm-btn btn-brutal px-3 py-2 bg-[#162C4E] text-white border-2 border-black shadow-[2px_2px_0_#000] flex items-center justify-between cursor-pointer">
                        <span class="text-[11px] font-extrabold uppercase">Dark Code Navy</span>
                        <span class="flex gap-1"><span class="w-3.5 h-3.5 bg-[#0B192E] border border-black"></span><span class="w-3.5 h-3.5 bg-[#38BDF8] border border-black"></span><span class="w-3.5 h-3.5 bg-[#FCD34D] border border-black"></span></span>
                    </button>
                    <button type="button" onclick="applyL4Theme('modern')" id="btn-thm-modern" class="thm-btn btn-brutal px-3 py-2 bg-[#162C4E] text-white border-2 border-black shadow-[2px_2px_0_#000] flex items-center justify-between cursor-pointer">
                        <span class="text-[11px] font-extrabold uppercase">Modern Clean Blue</span>
                        <span class="flex gap-1"><span class="w-3.5 h-3.5 bg-[#0D2D5E] border border-black"></span><span class="w-3.5 h-3.5 bg-[#FFFFFF] border border-black"></span><span class="w-3.5 h-3.5 bg-[#FDD34D] border border-black"></span></span>
                    </button>
                    <button type="button" onclick="applyL4Theme('glass')" id="btn-thm-glass" class="thm-btn btn-brutal px-3 py-2 bg-[#162C4E] text-white border-2 border-black shadow-[2px_2px_0_#000] flex items-center justify-between cursor-pointer">
                        <span class="text-[11px] font-extrabold uppercase">Glassmorphism Ocean</span>
                        <span class="flex gap-1"><span class="w-3.5 h-3.5 bg-[#0D356F] border border-black"></span><span class="w-3.5 h-3.5 bg-[#BAE6FD] border border-black"></span><span class="w-3.5 h-3.5 bg-[#FFFFFF] border border-black"></span></span>
                    </button>
                </div>
            </div>

            <!-- 2. EDIT KONTEN LIVE -->
            <div class="space-y-2.5 pt-3 border-t-2 border-white/10">
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-extrabold uppercase tracking-wider text-[#93C5FD]">2. Edit Konten Live</span>
                    <button type="button" onclick="resetActiveFrame()" class="text-[10px] font-bold text-[#F87171] hover:underline cursor-pointer">Reset Bingkai</button>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-bold uppercase text-white/60 block mb-1">Judul Baris 1</label>
                        <input id="inHead1" type="text" oninput="onLiveEdit()" class="w-full px-2.5 py-1.5 bg-[#081426] border-2 border-black text-white text-xs font-bold focus:outline-none focus:border-[#FCD34D]">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold uppercase text-white/60 block mb-1">Judul Baris 2</label>
                        <input id="inHead2" type="text" oninput="onLiveEdit()" class="w-full px-2.5 py-1.5 bg-[#081426] border-2 border-black text-white text-xs font-bold focus:outline-none focus:border-[#FCD34D]">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-2">
                        <label class="text-[10px] font-bold uppercase text-white/60 block mb-1">Judul Window</label>
                        <input id="inFilename" type="text" oninput="onLiveEdit()" class="w-full px-2.5 py-1.5 bg-[#081426] border-2 border-black text-white text-xs font-mono focus:outline-none focus:border-[#FCD34D]">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold uppercase text-white/60 block mb-1">Syntax</label>
                        <select id="inLang" onchange="onLiveEdit()" class="w-full px-2 py-1.5 bg-[#081426] border-2 border-black text-white text-xs font-mono font-bold focus:outline-none focus:border-[#FCD34D]">
                            <option value="JS">JS</option>
                            <option value="PY">PY</option>
                            <option value="GIT">GIT</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-bold uppercase text-white/60 block mb-1">Isi Kode / Terminal</label>
                    <textarea id="inCode" rows="6" oninput="onLiveEdit()" class="w-full px-2.5 py-2 bg-[#081426] border-2 border-black text-white text-[11px] font-mono leading-relaxed focus:outline-none focus:border-[#FCD34D]"></textarea>
                </div>
                <div>
                    <label class="text-[10px] font-bold uppercase text-white/60 block mb-1">Caption Kutipan Kartu</label>
                    <textarea id="inQuote" rows="2" oninput="onLiveEdit()" class="w-full px-2.5 py-1.5 bg-[#081426] border-2 border-black text-white text-xs focus:outline-none focus:border-[#FCD34D]"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-bold uppercase text-white/60 block mb-1">Watermark Latar</label>
                        <input id="inWatermark" type="text" oninput="onLiveEdit()" class="w-full px-2.5 py-1.5 bg-[#081426] border-2 border-black text-white text-xs font-bold uppercase focus:outline-none focus:border-[#FCD34D]">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold uppercase text-white/60 block mb-1">Akun IG Kartu</label>
                        <input id="inIg" type="text" oninput="onLiveGlobalIg()" class="w-full px-2.5 py-1.5 bg-[#081426] border-2 border-black text-white text-xs font-semibold focus:outline-none focus:border-[#FCD34D]">
                    </div>
                </div>
            </div>

            <!-- 3. DOCK BAWAH & PANDUAN CETAK -->
            <div class="space-y-2 pt-3 border-t-2 border-white/10">
                <span class="text-[11px] font-extrabold uppercase tracking-wider text-[#93C5FD] block">3. Opsi Tampilan &amp; Cetak</span>
                <button type="button" onclick="toggleFooterBar()" id="btnFooterBar" class="btn-brutal w-full px-3 py-2 bg-[#FCD34D] text-black border-2 border-black shadow-[2px_2px_0_#000] flex items-center justify-between text-[10.5px] font-extrabold uppercase cursor-pointer">
                    <span>Bar Bawah (IG &amp; Web)</span>
                    <span id="lblFooterState" class="px-1.5 py-0.5 bg-black text-[#FCD34D] text-[9px]">ON</span>
                </button>
                <button type="button" onclick="toggleGuides()" id="btnGuides" class="btn-brutal w-full px-3 py-2 bg-[#FCD34D] text-black border-2 border-black shadow-[2px_2px_0_#000] flex items-center justify-between text-[10.5px] font-extrabold uppercase cursor-pointer">
                    <span>Garis Margin (5mm &amp; 15mm)</span>
                    <span id="lblGuidesState" class="px-1.5 py-0.5 bg-black text-[#FCD34D] text-[9px]">ON</span>
                </button>
            </div>
        </div>

        <!-- Sticky Export Controls -->
        <div class="p-4 bg-[#0B192E] border-t-[3px] border-black space-y-2 shrink-0">
            <div class="grid grid-cols-2 gap-2">
                <button type="button" onclick="downloadActiveSvg()" class="btn-brutal py-2.5 bg-white text-[#091529] border-2 border-black shadow-[3px_3px_0_#000] text-[11px] font-extrabold uppercase cursor-pointer">
                    SVG (B.<span class="act-num">1</span>)
                </button>
                <button type="button" onclick="downloadActivePng()" class="btn-brutal py-2.5 bg-[#15803D] hover:bg-[#166534] text-white border-2 border-black shadow-[3px_3px_0_#000] text-[11px] font-extrabold uppercase cursor-pointer">
                    PNG 300 DPI (B.<span class="act-num">1</span>)
                </button>
            </div>
            <button type="button" onclick="downloadAllPngs()" class="btn-brutal w-full py-2 bg-[#16488E] hover:bg-[#1E5BB0] text-white border-2 border-black shadow-[3px_3px_0_#000] text-[10.5px] font-extrabold uppercase tracking-wider cursor-pointer">
                Unduh Semua 3 Bingkai PNG (300 DPI)
            </button>
        </div>
    </aside>

    <!-- RIGHT WORKSPACE STAGE -->
    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">

        <!-- Top Switcher Bar -->
        <div class="h-12 px-4 bg-[#0B192E] border-b-2 border-black flex items-center justify-between gap-3 shrink-0">
            <div class="flex items-center gap-2.5 min-w-0">
                <button type="button" onclick="toggleMobileSidebar(true)" class="lg:hidden btn-brutal px-3 py-1 bg-[#FCD34D] text-black border-2 border-black text-xs font-extrabold uppercase shadow-[2px_2px_0_#000000] cursor-pointer">
                    ☰ Editor
                </button>
                <div class="flex items-center gap-1.5">
                    <a href="index.html" class="btn-brutal px-2.5 py-1 bg-[#162C4E] hover:bg-[#1E3B68] text-sky-200 border border-black text-[10px] font-extrabold uppercase tracking-wider shadow-[2px_2px_0_#000000] whitespace-nowrap">Flyer &amp; Story</a>
                    <span class="px-2.5 py-1 bg-[#FCD34D] text-[#091529] border border-black text-[10px] font-extrabold uppercase tracking-wider whitespace-nowrap">Poster A5 • L4</span>
                    <a href="banner-proyektor.html" class="btn-brutal px-2.5 py-1 bg-[#16488E] hover:bg-[#1E5BB0] text-white border border-black text-[10px] font-extrabold uppercase tracking-wider shadow-[2px_2px_0_#000000] whitespace-nowrap">Banner Proyektor</a>
                </div>
            </div>

            <div class="flex items-center gap-2 shrink-0">
                <div class="hidden md:flex items-center gap-3 text-[10px] text-slate-300 mr-2">
                    <span class="inline-flex items-center gap-1"><span class="w-3 border-t-2 border-dashed border-rose-500 inline-block"></span>5mm</span>
                    <span class="inline-flex items-center gap-1"><span class="w-3 border-t-2 border-dashed border-sky-400 inline-block"></span>15mm Aman</span>
                </div>
                <div class="flex items-center gap-1">
                    <button type="button" onclick="setViewMode('all')" id="view-all" class="px-2.5 py-1 border border-black text-[10px] font-extrabold uppercase cursor-pointer">3 Bingkai</button>
                    <button type="button" onclick="setViewMode('single')" id="view-single" class="px-2.5 py-1 border border-black text-[10px] font-extrabold uppercase cursor-pointer">Fokus 1</button>
                </div>
            </div>
        </div>

        <!-- Centered Live Preview Stage -->
        <div class="workspace-stage flex-1 overflow-auto p-5 sm:p-7 flex flex-col items-center justify-center">
            <div id="stageHost" class="w-full max-w-[1140px]"></div>
        </div>
    </div>

function tokenizeCodeLine(line, lang, syn) {
    const trimmed = line.trim();
    if (!trimmed) return [];
    if ((lang === "JS" && trimmed.startsWith("//")) || (lang !== "JS" && trimmed.startsWith("#"))) {
        return [{ text: line, col: syn.comment }];
    }
    if (lang === "GIT") {
        if (trimmed.startsWith("$")) {
            const idx = line.indexOf("$");
            const prefix = line.slice(0, idx + 1);
            const rest = line.slice(idx + 1);
            const parts = [{ text: prefix, col: syn.prompt }];
            const strMatch = rest.match(/^(.*?)("[^"]*")(.*)$/);
            if (strMatch) {
                if (strMatch[1]) parts.push({ text: strMatch[1], col: syn.plain });
                parts.push({ text: strMatch[2], col: syn.str });
                if (strMatch[3]) parts.push({ text: strMatch[3], col: syn.plain });
            } else {
                parts.push({ text: rest, col: syn.plain });
            }
            return parts;
        }
        if (trimmed.startsWith(">")) {
            const colon = line.indexOf(":");
            if (colon !== -1) {
                return [
                    { text: line.slice(0, colon + 1), col: syn.fn },
                    { text: line.slice(colon + 1), col: syn.out }
                ];
            }
            return [{ text: line, col: syn.out }];
        }
    }

    const tokens = [];
    const regex = /("[^"]*"|'[^']*')|\b(const|let|var|while|if|not|def|return|null|true|false|git|commit|push|origin)\b|\b([A-Za-z_][A-Za-z0-9_]*)(?=\s*\()|\b(\d+)\b/g;
    let last = 0;
    let m;
    while ((m = regex.exec(line)) !== null) {
        if (m.index > last) tokens.push({ text: line.slice(last, m.index), col: syn.plain });
        if (m[1]) tokens.push({ text: m[1], col: syn.str });
        else if (m[2]) tokens.push({ text: m[2], col: syn.kw });
        else if (m[3]) tokens.push({ text: m[3], col: syn.fn });
        else if (m[4]) tokens.push({ text: m[4], col: syn.num });
        last = regex.lastIndex;
    }
    if (last < line.length) tokens.push({ text: line.slice(last), col: syn.plain });
    return tokens;
}

const _measCanvas = document.createElement("canvas");
const _mCtx = _measCanvas.getContext("2d");

function fitSingleLineFontSize(text, fontSpecFn, maxW, startPx, minPx) {
    let px = startPx;
    while (px > minPx) {
        _mCtx.font = fontSpecFn(px);
        if (_mCtx.measureText(text).width <= maxW) break;
        px -= 2;
    }
    return px;
}

function wrapTextLines(text, fontSpec, maxW) {
    _mCtx.font = fontSpec;
    const words = String(text || "").trim().split(/\s+/);
    const lines = [];
    let cur = "";
    for (const w of words) {
        const test = cur ? cur + " " + w : w;
        if (_mCtx.measureText(test).width <= maxW) {
            cur = test;
        } else {
            if (cur) lines.push(cur);
            cur = w;
        }
    }
    if (cur) lines.push(cur);
    return lines.length ? lines : [""];
}

function escapeXml(str) {
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&apos;");
}

// Layout 4 A5 IG Feed Stack Geometry (1480 x 2100)
// Back Card tilted subtly (+2.1 deg), Front Card dead-level, everything inside SAFE MARGIN (150..1330 x 150..1950)!
function computeL4Metrics(frame) {
    const T = L4_THEMES[frame.theme] || L4_THEMES["neubrutalism"];
    const card = {
        x: 186,
        y: showFooterBar ? 198 : 210,
        w: 1108,
        h: showFooterBar ? 1592 : 1680
    };
    const hdrH = 108;
    const padX = 34;

    // Inner Code Media Viewport inside IG Card
    const ftrH = 296;
    const media = {
        x: card.x + padX,
        y: card.y + hdrH + 14,
        w: card.w - padX * 2,
        h: card.h - hdrH - 14 - ftrH
    };
    const tbH = 66;
    const mBodyY = media.y + tbH;
    const mBodyH = media.h - tbH;

    // Headline at top of Media Viewport
    const linesHead = [frame.head1, frame.head2].map(s => (s || "").trim()).filter(Boolean);
    const headFontFam = "'Barlow Condensed', 'Space Grotesk', sans-serif";
    const headMaxW = media.w - 88;
    const startHeadPx = linesHead.length > 1 ? 82 : 94;
    let headPx = startHeadPx;
    for (const ln of linesHead) {
        headPx = Math.min(headPx, fitSingleLineFontSize(ln, px => `900 ${px}px ${headFontFam}`, headMaxW, startHeadPx, 46));
    }
    const headLH = Math.round(headPx * 0.98);
    const headStartY = mBodyY + 46;
    const headBotY = headStartY + Math.max(0, linesHead.length - 1) * headLH + Math.round(headPx * 0.85);
    const accentY = headBotY + 20;

    // Code block below headline inside Media Viewport
    const rawLines = (frame.code || "").replace(/\r\n/g, "\n").split("\n").slice(0, 11);
    const gutterW = 78;
    const codePadX = 32;
    const codeAreaTop = accentY + 34;
    const codeAreaH = (media.y + media.h) - codeAreaTop - 26;
    const codeMaxW = media.w - gutterW - codePadX * 2;
    const codeFam = "'JetBrains Mono', monospace";
    let codePx = 37;
    for (const ln of rawLines) {
        if (!ln.trim()) continue;
        codePx = Math.min(codePx, fitSingleLineFontSize(ln, px => `700 ${px}px ${codeFam}`, codeMaxW, 37, 22));
    }
    const codeLH = Math.min(Math.round(codePx * 1.96), Math.floor((codeAreaH - 36) / Math.max(1, rawLines.length)));
    const codeBlockH = (rawLines.length - 1) * codeLH;
    const codeTopPad = codeAreaTop + Math.max(24, Math.round((codeAreaH - codeBlockH) / 2) + Math.round(codePx * 0.30));

    // IG Card Bottom Footer (Action Row + Carousel Dots 1..3 + Caption)
    const actY = media.y + media.h + 36;
    const capY = actY + 74;
    const qFontFam = "'Plus Jakarta Sans', sans-serif";
    const capPx = 31;
    const capLH = 45;
    const igPrefix = `${globalIgHandle} `;
    _mCtx.font = `800 ${capPx}px 'Space Grotesk', sans-serif`;
    const handleW = _mCtx.measureText(igPrefix).width + 10;
    const fullCapText = frame.quote || "";
    const firstLineMaxW = media.w - handleW;
    const words = fullCapText.trim().split(/\s+/);
    let line1 = "";
    let restWords = [];
    _mCtx.font = `600 ${capPx}px ${qFontFam}`;
    for (let i = 0; i < words.length; i++) {
        const test = line1 ? line1 + " " + words[i] : words[i];
        if (_mCtx.measureText(test).width <= firstLineMaxW) {
            line1 = test;
        } else {
            restWords = words.slice(i);
            break;
        }
    }
    const capLines = [line1];
    if (restWords.length) {
        wrapTextLines(restWords.join(" "), `600 ${capPx}px ${qFontFam}`, media.w).slice(0, 2).forEach(l => capLines.push(l));
    }

    // Minimal Layout 4 Bottom Bar Dock
    const dock = { x: card.x, y: 1838, w: card.w, h: 74, rad: T.softShadow ? 12 : 8 };

    return {
        T, card, hdrH, padX, media, tbH, mBodyY, mBodyH,
        linesHead, headFontFam, headPx, headLH, headStartY, accentY,
        rawLines, gutterW, codePadX, codeFam, codePx, codeLH, codeTopPad,
        actY, capY, capPx, capLH, qFontFam, handleW, capLines, dock
    };
}

function generatePosterSvg(frame, includeGuides, forDownload) {
    const M = computeL4Metrics(frame);
    const { T, card, media, dock } = M;
    const uid = `l4_${frame.id}_${frame.theme}_${forDownload ? 'dl' : 'ui'}`;
    const parts = [];

    parts.push(`<svg xmlns="http://www.w3.org/2000/svg" width="148mm" height="210mm" viewBox="0 0 ${A5_W} ${A5_H}">`);
    parts.push(`<defs>`);
    if (forDownload) {
        parts.push(`<style>@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Barlow+Condensed:wght@700;800;900&amp;family=JetBrains+Mono:wght@500;700;800&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Space+Grotesk:wght@700&amp;display=swap');</style>`);
    }
    if (T.bgMode === "radial") {
        parts.push(`<radialGradient id="bg_${uid}" cx="50%" cy="38%" r="72%">`);
        parts.push(`<stop offset="0%" stop-color="${T.stops[0]}"/>`);
        parts.push(`<stop offset="48%" stop-color="${T.stops[1]}"/>`);
        parts.push(`<stop offset="100%" stop-color="${T.stops[2]}"/>`);
        parts.push(`</radialGradient>`);
    } else if (T.bgMode === "grad") {
        parts.push(`<linearGradient id="bg_${uid}" x1="0%" y1="0%" x2="100%" y2="100%">`);
        parts.push(`<stop offset="0%" stop-color="${T.stops[0]}"/>`);
        parts.push(`<stop offset="50%" stop-color="${T.stops[1]}"/>`);
        parts.push(`<stop offset="100%" stop-color="${T.stops[2]}"/>`);
        parts.push(`</linearGradient>`);
    }
    if (T.softShadow) {
        parts.push(`<filter id="soft_${uid}" x="-12%" y="-12%" width="128%" height="128%">`);
        parts.push(`<feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#05132C" flood-opacity="0.38"/>`);
        parts.push(`</filter>`);
    }
    parts.push(`<pattern id="dot_${uid}" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="18" cy="18" r="2.6" fill="${T.dot}"/></pattern>`);
    parts.push(`<clipPath id="cardclip_${uid}"><rect x="${card.x}" y="${card.y}" width="${card.w}" height="${card.h}" rx="${T.cardRad}"/></clipPath>`);
    parts.push(`<clipPath id="mediaclip_${uid}"><rect x="${media.x}" y="${media.y}" width="${media.w}" height="${media.h}" rx="${T.mediaRad}"/></clipPath>`);
    parts.push(`</defs>`);

    // 1. Background + Dot Grid
    parts.push(`<rect width="${A5_W}" height="${A5_H}" fill="${T.bgMode === 'solid' ? T.bg : `url(#bg_${uid})`}"/>`);
    parts.push(`<rect width="${A5_W}" height="${A5_H}" fill="url(#dot_${uid})"/>`);

    // 2. Signature Layout 4 Subtle Kinetic Watermark Wall (Zero visual overlap clutter)
    const wm = (frame.watermark || "HIMA IF").toUpperCase();
    const wmRow = `${wm}  ${wm}  ${wm}`;
    parts.push(`<g fill="${T.wallCol}" font-family="'Barlow Condensed', sans-serif" font-weight="900" font-size="164" letter-spacing="1">`);
    for (let r = 0; r < 11; r++) {
        const wy = 165 + r * 185;
        const wx = (r % 2 === 0) ? -40 : -240;
        parts.push(`<text x="${wx}" y="${wy}">${escapeXml(wmRow)}</text>`);
    }
    parts.push(`</g>`);

    // 3. 3-Layer Stacked IG Card (-2.6 deg back + +2.2 deg mid, safely inside 15mm margin!)
    const cx = card.x + card.w / 2;
    const cy = card.y + card.h / 2;
    if (!T.softShadow && T.backShadow > 0) {
        parts.push(`<g transform="rotate(-2.6 ${cx} ${cy})"><rect x="${card.x + T.backShadow + 2}" y="${card.y + T.backShadow + 2}" width="${card.w}" height="${card.h}" rx="${T.cardRad}" fill="#000000"/></g>`);
    }
    parts.push(`<g transform="rotate(-2.6 ${cx} ${cy})"><rect x="${card.x + 2}" y="${card.y + 2}" width="${card.w}" height="${card.h}" rx="${T.cardRad}" fill="${T.backFill}" stroke="${T.backBorder}" stroke-width="${T.backBW}"/></g>`);
    parts.push(`<g transform="rotate(2.2 ${cx} ${cy})"><rect x="${card.x - 4}" y="${card.y - 6}" width="${card.w}" height="${card.h}" rx="${T.cardRad}" fill="${T.midFill}" stroke="${T.midBorder}" stroke-width="${T.midBW}"/></g>`);

    // Front Main IG Card Shadow (for Neubrutalism / Dark Code)
    if (!T.softShadow && T.cardShadow > 0) {
        parts.push(`<rect x="${card.x + T.cardShadow}" y="${card.y + T.cardShadow}" width="${card.w}" height="${card.h}" rx="${T.cardRad}" fill="#000000"/>`);
    }

    // 4. Front Main IG Card
    const cardFilter = T.softShadow ? ` filter="url(#soft_${uid})"` : "";
    parts.push(`<g${cardFilter}><g clip-path="url(#cardclip_${uid})">`);
    parts.push(`<rect x="${card.x}" y="${card.y}" width="${card.w}" height="${card.h}" fill="${T.cardFill}"/>`);

    // 4a. IG Card Header (Avatar HMIF + Handle + Verified + Follow + Cursor + •••)
    const avR = 30;
    const avCx = card.x + M.padX + avR;
    const avCy = card.y + M.hdrH / 2;
    parts.push(`<circle cx="${avCx}" cy="${avCy}" r="${avR}" fill="${T.avBg}" stroke="${T.avBorder}" stroke-width="2.5"/>`);
    parts.push(`<image href="${LOGO_HIMA_B64}" x="${avCx - 20}" y="${avCy - 20}" width="40" height="40" preserveAspectRatio="xMidYMid meet"/>`);

    const hndX = avCx + avR + 18;
    parts.push(`<text x="${hndX}" y="${avCy + 10}" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="30" fill="${T.cardText}">${escapeXml(globalIgHandle)}</text>`);
    _mCtx.font = "700 30px 'Space Grotesk', sans-serif";
    const vx = hndX + _mCtx.measureText(globalIgHandle).width + 12;
    parts.push(`<g transform="translate(${vx}, ${avCy - 12})"><circle cx="12" cy="12" r="11" fill="${T.verifiedCol}"/><path d="M7 12.4l3.2 3.2L17 8.8" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g>`);

    // Right side of Card Header: Follow Pill + ••• + Pixel Cursor
    const folW = 130;
    const folH = 48;
    const folX = card.x + card.w - M.padX - 66 - folW;
    const folY = avCy - folH / 2;
    parts.push(`<rect x="${folX}" y="${folY}" width="${folW}" height="${folH}" rx="${T.followRad}" fill="${T.followFill}" stroke="${T.followBorder}" stroke-width="${T.followBW}"/>`);
    parts.push(`<text x="${folX + folW / 2}" y="${folY + 32}" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="22" fill="${T.followText}">Follow</text>`);

    // 3 Horizontal Dots (•••)
    [0, 14, 28].forEach(dx => {
        parts.push(`<circle cx="${folX + folW + 24 + dx}" cy="${avCy}" r="4.2" fill="${T.moreCol}"/>`);
    });

    // Authentic 8-Bit Pixel Cursor pointing at Follow pill
    const curPal = L4_CURSOR_PALETTES[frame.theme] || L4_CURSOR_PALETTES["neubrutalism"];
    const cScale = 2.6;
    const cX = folX + folW - 34;
    const cY = folY + folH - 12;
    let curRects = "";
    L4_CURSOR_MAP.forEach((row, ry) => {
        for (let rx = 0; rx < row.length; rx++) {
            const c = curPal[row[rx]];
            if (c) curRects += `<rect x="${rx}" y="${ry}" width="1" height="1" fill="${c}"/>`;
        }
    });
    parts.push(`<g transform="translate(${cX}, ${cY}) scale(${cScale})">${curRects}</g>`);
    parts.push(`<line x1="${card.x}" y1="${card.y + M.hdrH}" x2="${card.x + card.w}" y2="${card.y + M.hdrH}" stroke="${T.hdrDiv}" stroke-width="1.5"/>`);

    // 4b. Inner OS / Code Media Viewport
    parts.push(`<g clip-path="url(#mediaclip_${uid})">`);
    parts.push(`<rect x="${media.x}" y="${media.y}" width="${media.w}" height="${media.h}" fill="${T.mediaFill}"/>`);
    for (let gx = media.x; gx <= media.x + media.w; gx += 44) {
        parts.push(`<line x1="${gx}" y1="${M.mBodyY}" x2="${gx}" y2="${media.y + media.h}" stroke="${T.mediaGrid}" stroke-width="1"/>`);
    }
    for (let gy = M.mBodyY; gy <= media.y + media.h; gy += 44) {
        parts.push(`<line x1="${media.x}" y1="${gy}" x2="${media.x + media.w}" y2="${gy}" stroke="${T.mediaGrid}" stroke-width="1"/>`);
    }

    // Gutter
    parts.push(`<rect x="${media.x}" y="${M.mBodyY}" width="${M.gutterW}" height="${M.mBodyH}" fill="${T.gutterFill}" opacity="0.55"/>`);

    // OS Window Bar
    parts.push(`<rect x="${media.x}" y="${media.y}" width="${media.w}" height="${M.tbH}" fill="${T.tbFill}"/>`);
    parts.push(`<line x1="${media.x}" y1="${M.mBodyY}" x2="${media.x + media.w}" y2="${M.mBodyY}" stroke="${T.tbBorder}" stroke-width="${Math.max(1.5, T.mediaBW - 0.5)}"/>`);
    T.wd.forEach((col, i) => {
        const dx = media.x + 34 + i * 28;
        const dy = media.y + M.tbH / 2;
        if (T.wdSq) {
            parts.push(`<rect x="${dx - 8}" y="${dy - 8}" width="16" height="16" fill="${col}" stroke="#000000" stroke-width="1.8"/>`);
        } else {
            parts.push(`<circle cx="${dx}" cy="${dy}" r="8.5" fill="${col}"/>`);
        }
    });
    parts.push(`<text x="${media.x + 138}" y="${media.y + 41}" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="22" letter-spacing="0.4" fill="${T.tbText}">${escapeXml(frame.filename)}</text>`);

    // Headline Inside Top of Media Viewport
    const headX = media.x + M.gutterW + M.codePadX;
    M.linesHead.forEach((ln, idx) => {
        const hy = M.headStartY + idx * M.headLH;
        parts.push(`<text x="${headX}" y="${hy + Math.round(M.headPx * 0.78)}" font-family="${M.headFontFam}" font-weight="900" font-size="${M.headPx}" letter-spacing="-0.5" fill="${T.headCol}">${escapeXml(ln)}</text>`);
    });
    parts.push(`<rect x="${headX}" y="${M.accentY}" width="136" height="9" rx="${T.softShadow ? 4.5 : 0}" fill="${T.accentCol}"/>`);

    // Syntax-Highlighted Code Block Inside Media Viewport
    M.rawLines.forEach((rawLine, idx) => {
        const lineY = M.codeTopPad + idx * M.codeLH;
        const numStr = String(idx + 1).padStart(2, "0");
        parts.push(`<text x="${media.x + M.gutterW / 2}" y="${lineY}" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="${Math.round(M.codePx * 0.66)}" fill="${T.gutterCol}" opacity="0.72">${numStr}</text>`);
        const toks = tokenizeCodeLine(rawLine, frame.lang, T.syn);
        if (toks.length > 0) {
            const tspans = toks.map(tok => `<tspan fill="${tok.col}">${escapeXml(tok.text)}</tspan>`).join("");
            parts.push(`<text x="${headX}" y="${lineY}" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="${M.codePx}" xml:space="preserve">${tspans}</text>`);
        }
    });
    parts.push(`</g>`);
    if (T.mediaBW > 0) {
        parts.push(`<rect x="${media.x}" y="${media.y}" width="${media.w}" height="${media.h}" rx="${T.mediaRad}" fill="none" stroke="${T.mediaBorder}" stroke-width="${T.mediaBW}"/>`);
    }

    // 4c. IG Action Row (Heart, Comment, Share + Active Carousel Dot 1/2/3 + Bookmark!)
    const ax0 = media.x;
    const ay0 = M.actY;
    // Heart
    parts.push(`<g transform="translate(${ax0}, ${ay0}) scale(1.7)"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="${T.heartCol}"/></g>`);
    // Comment
    parts.push(`<g transform="translate(${ax0 + 60}, ${ay0}) scale(1.7)"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" fill="none" stroke="${T.actCol}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>`);
    // Share
    parts.push(`<g transform="translate(${ax0 + 120}, ${ay0}) scale(1.7)"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" fill="none" stroke="${T.actCol}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>`);

    // 3-Slide Carousel Dots (Highlights frame.id = 1, 2, or 3!)
    const dotCenterX = card.x + card.w / 2;
    const dotCy = ay0 + 21;
    [1, 2, 3].forEach((sid, idx) => {
        const ddx = dotCenterX + (idx - 1) * 26;
        const active = sid === frame.id;
        parts.push(`<circle cx="${ddx}" cy="${dotCy}" r="${active ? 7.5 : 5.5}" fill="${active ? T.dotActive : T.dotIdle}"/>`);
    });

    // Bookmark
    parts.push(`<g transform="translate(${media.x + media.w - 38}, ${ay0}) scale(1.7)"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" fill="none" stroke="${T.actCol}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>`);

    // Clean IG Caption (Bold handle + Core Quote, NO fake likes count!)
    parts.push(`<text x="${media.x}" y="${M.capY}" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="${M.capPx}" fill="${T.cardText}">${escapeXml(globalIgHandle)}</text>`);
    M.capLines.forEach((ln, idx) => {
        const cxLine = idx === 0 ? media.x + M.handleW : media.x;
        const cyLine = M.capY + idx * M.capLH;
        parts.push(`<text x="${cxLine}" y="${cyLine}" font-family="${M.qFontFam}" font-weight="600" font-size="${M.capPx}" fill="${T.cardSubText}">${escapeXml(ln)}</text>`);
    });

    parts.push(`</g>`);
    if (T.cardBW > 0) {
        parts.push(`<rect x="${card.x}" y="${card.y}" width="${card.w}" height="${card.h}" rx="${T.cardRad}" fill="none" stroke="${T.cardBorder}" stroke-width="${T.cardBW}"/>`);
    }
    parts.push(`</g>`);

    // 5. Optional Layout 4 Bottom Bar Dock (IG + Web)
    if (showFooterBar) {
        const dFilter = T.softShadow ? ` filter="url(#soft_${uid})"` : "";
        parts.push(`<rect x="${dock.x}" y="${dock.y}" width="${dock.w}" height="${dock.h}" rx="${dock.rad}" fill="${T.barFill}" stroke="${T.barBorder}" stroke-width="${T.barBW}"${dFilter}/>`);
        const dyMid = dock.y + dock.h / 2;
        // IG Icon
        parts.push(`<g transform="translate(${dock.x + 28}, ${dyMid - 15}) scale(1.25)"><rect x="2" y="2" width="20" height="20" rx="5" fill="none" stroke="${T.barIcon}" stroke-width="2.4"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="${T.barIcon}" stroke-width="2.4"/><circle cx="17.5" cy="6.5" r="1.3" fill="${T.barIcon}"/></g>`);
        parts.push(`<text x="${dock.x + 70}" y="${dyMid + 8}" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="24" letter-spacing="0.6" fill="${T.barText}">${escapeXml(globalIgHandle)}</text>`);

        // Globe Icon + Web
        const webText = "GO.HMIF-LPKIA.MY.ID";
        _mCtx.font = "700 22px 'JetBrains Mono', monospace";
        const webW = _mCtx.measureText(webText).width;
        const webX = dock.x + dock.w - 28;
        parts.push(`<g transform="translate(${webX - webW - 42}, ${dyMid - 15}) scale(1.25)"><circle cx="12" cy="12" r="9" fill="none" stroke="${T.barIcon}" stroke-width="2.3"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" fill="none" stroke="${T.barIcon}" stroke-width="2.2"/></g>`);
        parts.push(`<text x="${webX}" y="${dyMid + 8}" text-anchor="end" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="22" letter-spacing="0.5" fill="${T.barText}">${webText}</text>`);
    }

    // 6. Print Margin Guides (Preview only)
    if (includeGuides && !forDownload) {
        parts.push(`<g id="print-guides" opacity="0.9">`);
        parts.push(`<rect x="50" y="50" width="1380" height="2000" fill="none" stroke="#F43F5E" stroke-width="3" stroke-dasharray="16 10"/>`);
        parts.push(`<rect x="150" y="150" width="1180" height="1800" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="12 10"/>`);
        parts.push(`</g>`);
    }

    parts.push(`</svg>`);
    return parts.join("\n");
}

function drawRoundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) {
        ctx.roundRect(x, y, w, h, r);
    } else {
        const rr = Math.min(r, w / 2, h / 2);
        ctx.moveTo(x + rr, y);
        ctx.arcTo(x + w, y, x + w, y + h, rr);
        ctx.arcTo(x + w, y + h, x, y + h, rr);
        ctx.arcTo(x, y + h, x, y, rr);
        ctx.arcTo(x, y, x + w, y, rr);
        ctx.closePath();
    }
}

async function renderFrameToPngBytes(frame) {
    if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
    }
    await Promise.all(Object.values(LOGO_IMAGES).map(img => img.complete ? Promise.resolve() : new Promise(r => { img.onload = r; img.onerror = r; })));

    const M = computeL4Metrics(frame);
    const { T, card, media, dock } = M;

    const canvas = document.createElement("canvas");
    canvas.width = PNG_W;
    canvas.height = PNG_H;
    const ctx = canvas.getContext("2d");

    ctx.save();
    ctx.scale(PNG_W / A5_W, PNG_H / A5_H);

    // 1. Background + Dot Grid
    if (T.bgMode === "radial") {
        const rg = ctx.createRadialGradient(A5_W * 0.5, A5_H * 0.38, 0, A5_W * 0.5, A5_H * 0.38, 1280);
        rg.addColorStop(0, T.stops[0]);
        rg.addColorStop(0.48, T.stops[1]);
        rg.addColorStop(1, T.stops[2]);
        ctx.fillStyle = rg;
    } else if (T.bgMode === "grad") {
        const lg = ctx.createLinearGradient(0, 0, A5_W, A5_H);
        lg.addColorStop(0, T.stops[0]);
        lg.addColorStop(0.5, T.stops[1]);
        lg.addColorStop(1, T.stops[2]);
        ctx.fillStyle = lg;
    } else {
        ctx.fillStyle = T.bg;
    }
    ctx.fillRect(0, 0, A5_W, A5_H);

    ctx.fillStyle = T.dot;
    for (let py = 18; py < A5_H; py += 36) {
        for (let px = 18; px < A5_W; px += 36) {
            ctx.beginPath();
            ctx.arc(px, py, 2.6, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // 2. Watermark Typography Wall
    const wm = (frame.watermark || "HIMA IF").toUpperCase();
    const wmRow = `${wm}  ${wm}  ${wm}`;
    ctx.fillStyle = T.wallCol;
    ctx.font = "900 164px 'Barlow Condensed', sans-serif";
    ctx.textBaseline = "alphabetic";
    ctx.textAlign = "left";
    for (let r = 0; r < 11; r++) {
        const wy = 165 + r * 185;
        const wx = (r % 2 === 0) ? -40 : -240;
        ctx.fillText(wmRow, wx, wy);
    }

    function applySoftShadow() {
        if (T.softShadow) {
            ctx.shadowColor = "rgba(5, 19, 44, 0.38)";
            ctx.shadowBlur = 32;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 16;
        }
    }
    function clearShadow() {
        ctx.shadowColor = "transparent";
        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;
    }

    // 3. 3-Layer Stacked IG Card (-2.6 deg back + +2.2 deg mid)
    const cx = card.x + card.w / 2;
    const cy = card.y + card.h / 2;
    if (!T.softShadow && T.backShadow > 0) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(-2.6 * Math.PI / 180);
        ctx.translate(-cx, -cy);
        ctx.fillStyle = "#000000";
        drawRoundRect(ctx, card.x + T.backShadow + 2, card.y + T.backShadow + 2, card.w, card.h, T.cardRad);
        ctx.fill();
        ctx.restore();
    }
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-2.6 * Math.PI / 180);
    ctx.translate(-cx, -cy);
    ctx.fillStyle = T.backFill;
    drawRoundRect(ctx, card.x + 2, card.y + 2, card.w, card.h, T.cardRad);
    ctx.fill();
    if (T.backBW > 0 && T.backBorder !== "transparent") {
        ctx.strokeStyle = T.backBorder;
        ctx.lineWidth = T.backBW;
        ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(2.2 * Math.PI / 180);
    ctx.translate(-cx, -cy);
    ctx.fillStyle = T.midFill;
    drawRoundRect(ctx, card.x - 4, card.y - 6, card.w, card.h, T.cardRad);
    ctx.fill();
    if (T.midBW > 0 && T.midBorder !== "transparent") {
        ctx.strokeStyle = T.midBorder;
        ctx.lineWidth = T.midBW;
        ctx.stroke();
    }
    ctx.restore();

    // Front Card Shadow
    if (!T.softShadow && T.cardShadow > 0) {
        ctx.fillStyle = "#000000";
        drawRoundRect(ctx, card.x + T.cardShadow, card.y + T.cardShadow, card.w, card.h, T.cardRad);
        ctx.fill();
    }
    if (T.softShadow) {
        applySoftShadow();
        ctx.fillStyle = T.cardFill;
        drawRoundRect(ctx, card.x, card.y, card.w, card.h, T.cardRad);
        ctx.fill();
        clearShadow();
    }

    // 4. Front IG Card Clipped Content
    ctx.save();
    drawRoundRect(ctx, card.x, card.y, card.w, card.h, T.cardRad);
    ctx.clip();

    ctx.fillStyle = T.cardFill;
    ctx.fillRect(card.x, card.y, card.w, card.h);

    // Header Row
    const avR = 30;
    const avCx = card.x + M.padX + avR;
    const avCy = card.y + M.hdrH / 2;
    ctx.fillStyle = T.avBg;
    ctx.beginPath(); ctx.arc(avCx, avCy, avR, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = T.avBorder;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    const himaIm = LOGO_IMAGES.hima;
    const iw = himaIm.naturalWidth || 100;
    const ih = himaIm.naturalHeight || 100;
    const sc = Math.min(40 / iw, 40 / ih);
    ctx.drawImage(himaIm, avCx - (iw * sc) / 2, avCy - (ih * sc) / 2, iw * sc, ih * sc);

    const hndX = avCx + avR + 18;
    ctx.fillStyle = T.cardText;
    ctx.font = "700 30px 'Space Grotesk', sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(globalIgHandle, hndX, avCy + 10);
    const vx = hndX + ctx.measureText(globalIgHandle).width + 12;

    // Verified Check
    ctx.save();
    ctx.translate(vx, avCy - 12);
    ctx.fillStyle = T.verifiedCol;
    ctx.beginPath(); ctx.arc(12, 12, 11, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#FFFFFF";
    ctx.lineWidth = 2.8;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(7, 12.4); ctx.lineTo(10.2, 15.6); ctx.lineTo(17, 8.8); ctx.stroke();
    ctx.restore();

    // Follow Pill
    const folW = 130;
    const folH = 48;
    const folX = card.x + card.w - M.padX - 66 - folW;
    const folY = avCy - folH / 2;
    ctx.fillStyle = T.followFill;
    drawRoundRect(ctx, folX, folY, folW, folH, T.followRad);
    ctx.fill();
    if (T.followBW > 0 && T.followBorder !== "transparent") {
        ctx.strokeStyle = T.followBorder;
        ctx.lineWidth = T.followBW;
        ctx.stroke();
    }
    ctx.fillStyle = T.followText;
    ctx.font = "700 22px 'Space Grotesk', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Follow", folX + folW / 2, folY + 32);

    ctx.fillStyle = T.moreCol;
    [0, 14, 28].forEach(dx => {
        ctx.beginPath(); ctx.arc(folX + folW + 24 + dx, avCy, 4.2, 0, Math.PI * 2); ctx.fill();
    });

    // Pixel Cursor
    const curPal = L4_CURSOR_PALETTES[frame.theme] || L4_CURSOR_PALETTES["neubrutalism"];
    const cScale = 2.6;
    const cX = folX + folW - 34;
    const cY = folY + folH - 12;
    ctx.save();
    ctx.translate(cX, cY);
    ctx.scale(cScale, cScale);
    L4_CURSOR_MAP.forEach((row, ry) => {
        for (let rx = 0; rx < row.length; rx++) {
            const c = curPal[row[rx]];
            if (c) {
                ctx.fillStyle = c;
                ctx.fillRect(rx, ry, 1, 1);
            }
        }
    });
    ctx.restore();

    ctx.strokeStyle = T.hdrDiv;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(card.x, card.y + M.hdrH); ctx.lineTo(card.x + card.w, card.y + M.hdrH); ctx.stroke();

    // Inner Code Media Viewport
    ctx.save();
    drawRoundRect(ctx, media.x, media.y, media.w, media.h, T.mediaRad);
    ctx.clip();

    ctx.fillStyle = T.mediaFill;
    ctx.fillRect(media.x, media.y, media.w, media.h);

    ctx.strokeStyle = T.mediaGrid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let gx = media.x; gx <= media.x + media.w; gx += 44) { ctx.moveTo(gx, M.mBodyY); ctx.lineTo(gx, media.y + media.h); }
    for (let gy = M.mBodyY; gy <= media.y + media.h; gy += 44) { ctx.moveTo(media.x, gy); ctx.lineTo(media.x + media.w, gy); }
    ctx.stroke();

    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = T.gutterFill;
    ctx.fillRect(media.x, M.mBodyY, M.gutterW, M.mBodyH);
    ctx.restore();

    // OS Window Chrome Bar
    ctx.fillStyle = T.tbFill;
    ctx.fillRect(media.x, media.y, media.w, M.tbH);
    ctx.strokeStyle = T.tbBorder;
    ctx.lineWidth = Math.max(1.5, T.mediaBW - 0.5);
    ctx.beginPath(); ctx.moveTo(media.x, M.mBodyY); ctx.lineTo(media.x + media.w, M.mBodyY); ctx.stroke();

    T.wd.forEach((col, i) => {
        const dx = media.x + 34 + i * 28;
        const dy = media.y + M.tbH / 2;
        ctx.fillStyle = col;
        if (T.wdSq) {
            ctx.fillRect(dx - 8, dy - 8, 16, 16);
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 1.8;
            ctx.strokeRect(dx - 8, dy - 8, 16, 16);
        } else {
            ctx.beginPath(); ctx.arc(dx, dy, 8.5, 0, Math.PI * 2); ctx.fill();
        }
    });

    ctx.fillStyle = T.tbText;
    ctx.font = "700 22px 'JetBrains Mono', monospace";
    ctx.textAlign = "left";
    ctx.fillText(frame.filename, media.x + 138, media.y + 41);

    // Headline Inside Media Viewport
    const headX = media.x + M.gutterW + M.codePadX;
    ctx.fillStyle = T.headCol;
    ctx.font = `900 ${M.headPx}px ${M.headFontFam}`;
    M.linesHead.forEach((ln, idx) => {
        const hy = M.headStartY + idx * M.headLH;
        ctx.fillText(ln, headX, hy + Math.round(M.headPx * 0.78));
    });
    ctx.fillStyle = T.accentCol;
    drawRoundRect(ctx, headX, M.accentY, 136, 9, T.softShadow ? 4.5 : 0);
    ctx.fill();

    // Syntax Code Block
    M.rawLines.forEach((rawLine, idx) => {
        const lineY = M.codeTopPad + idx * M.codeLH;
        const numStr = String(idx + 1).padStart(2, "0");
        ctx.save();
        ctx.globalAlpha = 0.72;
        ctx.fillStyle = T.gutterCol;
        ctx.font = `700 ${Math.round(M.codePx * 0.66)}px 'JetBrains Mono', monospace`;
        ctx.textAlign = "center";
        ctx.fillText(numStr, media.x + M.gutterW / 2, lineY);
        ctx.restore();

        const toks = tokenizeCodeLine(rawLine, frame.lang, T.syn);
        ctx.font = `700 ${M.codePx}px 'JetBrains Mono', monospace`;
        ctx.textAlign = "left";
        let curX = headX;
        toks.forEach(tok => {
            ctx.fillStyle = tok.col;
            ctx.fillText(tok.text, curX, lineY);
            curX += ctx.measureText(tok.text).width;
        });
    });

    ctx.restore();
    if (T.mediaBW > 0) {
        ctx.strokeStyle = T.mediaBorder;
        ctx.lineWidth = T.mediaBW;
        drawRoundRect(ctx, media.x, media.y, media.w, media.h, T.mediaRad);
        ctx.stroke();
    }

    // Card Footer: Heart + Comment + Share + Active Carousel Dots + Caption
    const ax0 = media.x;
    const ay0 = M.actY;

    ctx.save();
    ctx.translate(ax0, ay0);
    ctx.scale(1.7, 1.7);
    ctx.fillStyle = T.heartCol;
    ctx.fill(new Path2D("M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"));
    ctx.restore();

    ctx.save();
    ctx.translate(ax0 + 60, ay0);
    ctx.scale(1.7, 1.7);
    ctx.strokeStyle = T.actCol;
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.stroke(new Path2D("M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"));
    ctx.restore();

    ctx.save();
    ctx.translate(ax0 + 120, ay0);
    ctx.scale(1.7, 1.7);
    ctx.strokeStyle = T.actCol;
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.stroke(new Path2D("M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"));
    ctx.restore();

    const dotCenterX = card.x + card.w / 2;
    const dotCy = ay0 + 21;
    [1, 2, 3].forEach((sid, idx) => {
        const ddx = dotCenterX + (idx - 1) * 26;
        const active = sid === frame.id;
        ctx.fillStyle = active ? T.dotActive : T.dotIdle;
        ctx.beginPath(); ctx.arc(ddx, dotCy, active ? 7.5 : 5.5, 0, Math.PI * 2); ctx.fill();
    });

    ctx.save();
    ctx.translate(media.x + media.w - 38, ay0);
    ctx.scale(1.7, 1.7);
    ctx.strokeStyle = T.actCol;
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.stroke(new Path2D("M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"));
    ctx.restore();

    ctx.textAlign = "left";
    ctx.fillStyle = T.cardText;
    ctx.font = `800 ${M.capPx}px 'Space Grotesk', sans-serif`;
    ctx.fillText(globalIgHandle, media.x, M.capY);
    ctx.fillStyle = T.cardSubText;
    ctx.font = `600 ${M.capPx}px ${M.qFontFam}`;
    M.capLines.forEach((ln, idx) => {
        const cxLine = idx === 0 ? media.x + M.handleW : media.x;
        const cyLine = M.capY + idx * M.capLH;
        ctx.fillText(ln, cxLine, cyLine);
    });

    ctx.restore();
    if (T.cardBW > 0) {
        ctx.strokeStyle = T.cardBorder;
        ctx.lineWidth = T.cardBW;
        drawRoundRect(ctx, card.x, card.y, card.w, card.h, T.cardRad);
        ctx.stroke();
    }

    // 5. Bottom Dock Bar
    if (showFooterBar) {
        if (T.softShadow) applySoftShadow();
        ctx.fillStyle = T.barFill;
        drawRoundRect(ctx, dock.x, dock.y, dock.w, dock.h, dock.rad);
        ctx.fill();
        clearShadow();
        if (T.barBW > 0 && T.barBorder !== "transparent") {
            ctx.strokeStyle = T.barBorder;
            ctx.lineWidth = T.barBW;
            ctx.stroke();
        }
        const dyMid = dock.y + dock.h / 2;

        ctx.save();
        ctx.translate(dock.x + 28, dyMid - 15);
        ctx.scale(1.25, 1.25);
        ctx.strokeStyle = T.barIcon;
        ctx.lineWidth = 2.4;
        drawRoundRect(ctx, 2, 2, 20, 20, 5); ctx.stroke();
        ctx.beginPath(); ctx.arc(12, 12, 4.5, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = T.barIcon;
        ctx.beginPath(); ctx.arc(17.5, 6.5, 1.3, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        ctx.fillStyle = T.barText;
        ctx.font = "700 24px 'Space Grotesk', sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(globalIgHandle, dock.x + 70, dyMid + 8);

        const webText = "GO.HMIF-LPKIA.MY.ID";
        ctx.font = "700 22px 'JetBrains Mono', monospace";
        const webW = ctx.measureText(webText).width;
        const webX = dock.x + dock.w - 28;
        ctx.save();
        ctx.translate(webX - webW - 42, dyMid - 15);
        ctx.scale(1.25, 1.25);
        ctx.strokeStyle = T.barIcon;
        ctx.lineWidth = 2.3;
        ctx.beginPath(); ctx.arc(12, 12, 9, 0, Math.PI * 2); ctx.stroke();
        ctx.stroke(new Path2D("M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"));
        ctx.restore();

        ctx.textAlign = "right";
        ctx.fillText(webText, webX, dyMid + 8);
    }

    ctx.restore();

    const dataUrl = canvas.toDataURL("image/png");
    const b64Raw = dataUrl.split(",")[1];
    const binStr = atob(b64Raw);
    const arr = new Uint8Array(binStr.length);
    for (let i = 0; i < binStr.length; i++) arr[i] = binStr.charCodeAt(i);
    return injectPng300DpiBytes(arr);
}

const _crcTable = (() => {
    const tbl = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        tbl[n] = c >>> 0;
    }
    return tbl;
})();

function crc32Bytes(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = _crcTable[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
}

function injectPng300DpiBytes(arr) {
    const ppm = 11811;
    const physChunk = new Uint8Array(21);
    const dv = new DataView(physChunk.buffer);
    dv.setUint32(0, 9);
    physChunk.set([0x70, 0x48, 0x59, 0x73], 4);
    dv.setUint32(8, ppm);
    dv.setUint32(12, ppm);
    physChunk[16] = 1;
    dv.setUint32(17, crc32Bytes(physChunk.slice(4, 17)));

    const out = new Uint8Array(arr.length + physChunk.length);
    out.set(arr.slice(0, 33), 0);
    out.set(physChunk, 33);
    out.set(arr.slice(33), 33 + physChunk.length);
    return out;
}

function uint8ToDataUrl(u8) {
    let bin = "";
    const chunk = 0x8000;
    for (let i = 0; i < u8.length; i += chunk) {
        bin += String.fromCharCode.apply(null, u8.subarray(i, i + chunk));
    }
    return "data:image/png;base64," + btoa(bin);
}

function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function downloadSvgFrame(id) {
    const frame = framesState.find(f => f.id === id);
    if (!frame) return;
    const svgText = '<?xml version="1.0" encoding="UTF-8"?>\n' + generatePosterSvg(frame, false, true);
    triggerDownload(new Blob([svgText], { type: "image/svg+xml;charset=utf-8" }), `${frame.slug}-layout4-${frame.theme}.svg`);
}

async function downloadPngFrame(id) {
    const frame = framesState.find(f => f.id === id);
    if (!frame) return;
    const bytes = await renderFrameToPngBytes(frame);
    triggerDownload(new Blob([bytes], { type: "image/png" }), `${frame.slug}-layout4-${frame.theme}-300dpi.png`);
}

function downloadActiveSvg() { downloadSvgFrame(activeFrameId); }
function downloadActivePng() { downloadPngFrame(activeFrameId); }

async function downloadAllPngs() {
    for (const f of framesState) {
        await downloadPngFrame(f.id);
        await new Promise(r => setTimeout(r, 250));
    }
}

// Sidebar & Stage State Controllers
function toggleMobileSidebar(open) {
    const sb = document.getElementById("builderSidebar");
    const bd = document.getElementById("mobileBackdrop");
    if (open) {
        sb.classList.remove("-translate-x-full");
        bd.classList.remove("hidden");
    } else {
        sb.classList.add("-translate-x-full");
        bd.classList.add("hidden");
    }
}

function getActiveFrame() {
    return framesState.find(f => f.id === activeFrameId) || framesState[0];
}

function syncSidebarInputsFromFrame() {
    const f = getActiveFrame();
    document.getElementById("inHead1").value = f.head1;
    document.getElementById("inHead2").value = f.head2;
    document.getElementById("inFilename").value = f.filename;
    document.getElementById("inLang").value = f.lang;
    document.getElementById("inCode").value = f.code;
    document.getElementById("inQuote").value = f.quote;
    document.getElementById("inWatermark").value = f.watermark;
    document.getElementById("inIg").value = globalIgHandle;
}

function selectActiveFrame(id) {
    activeFrameId = id;
    syncSidebarInputsFromFrame();
    renderStudio();
}

function toggleSyncThemes() {
    syncAllThemes = !syncAllThemes;
    if (syncAllThemes) {
        const thm = getActiveFrame().theme;
        framesState.forEach(f => { f.theme = thm; });
    }
    renderStudio();
}

function applyL4Theme(themeName) {
    if (syncAllThemes) {
        framesState.forEach(f => { f.theme = themeName; });
    } else {
        getActiveFrame().theme = themeName;
    }
    renderStudio();
}

function onLiveEdit() {
    const f = getActiveFrame();
    f.head1 = document.getElementById("inHead1").value;
    f.head2 = document.getElementById("inHead2").value;
    f.filename = document.getElementById("inFilename").value;
    f.lang = document.getElementById("inLang").value;
    f.code = document.getElementById("inCode").value;
    f.quote = document.getElementById("inQuote").value;
    f.watermark = document.getElementById("inWatermark").value;
    renderStageOnly();
}

function onLiveGlobalIg() {
    globalIgHandle = document.getElementById("inIg").value || "hmif_LPKIA";
    renderStageOnly();
}

function resetActiveFrame() {
    const idx = framesState.findIndex(f => f.id === activeFrameId);
    if (idx === -1) return;
    const keepTheme = framesState[idx].theme;
    framesState[idx] = JSON.parse(JSON.stringify(DEFAULT_FRAMES[idx]));
    framesState[idx].theme = keepTheme;
    syncSidebarInputsFromFrame();
    renderStudio();
}

function toggleFooterBar() {
    showFooterBar = !showFooterBar;
    renderStudio();
}

function toggleGuides() {
    showGuides = !showGuides;
    renderStudio();
}

function setViewMode(mode) {
    viewMode = mode;
    renderStudio();
}

function syncButtonStates() {
    const f = getActiveFrame();
    document.getElementById("lblActiveFrameMeta").textContent = `Slide ${f.id} / 3`;
    document.querySelectorAll(".act-num").forEach(el => { el.textContent = String(f.id); });

    [1, 2, 3].forEach(id => {
        const b = document.getElementById(`btn-frame-${id}`);
        if (id === activeFrameId) {
            b.className = "btn-brutal py-2 px-2 bg-[#FCD34D] text-black border-2 border-black shadow-[3px_3px_0_#000000] text-center cursor-pointer";
        } else {
            b.className = "btn-brutal py-2 px-2 bg-[#162C4E] text-white border-2 border-black shadow-[3px_3px_0_#000000] text-center cursor-pointer";
        }
    });

    const syncBtn = document.getElementById("btnSyncTheme");
    if (syncAllThemes) {
        syncBtn.textContent = "Seragam 3 Set";
        syncBtn.className = "px-2 py-0.5 border border-black bg-[#FCD34D] text-black text-[9.5px] font-extrabold uppercase cursor-pointer";
    } else {
        syncBtn.textContent = "Per Bingkai";
        syncBtn.className = "px-2 py-0.5 border border-black bg-[#162C4E] text-sky-200 text-[9.5px] font-extrabold uppercase cursor-pointer";
    }

    document.querySelectorAll(".thm-btn").forEach(btn => {
        const thm = btn.id.replace("btn-thm-", "");
        if (thm === f.theme) {
            btn.className = "thm-btn btn-brutal px-3 py-2 bg-[#FCD34D] text-black border-2 border-black shadow-[3px_3px_0_#000] flex items-center justify-between cursor-pointer";
        } else {
            btn.className = "thm-btn btn-brutal px-3 py-2 bg-[#162C4E] text-white border-2 border-black shadow-[2px_2px_0_#000] flex items-center justify-between cursor-pointer";
        }
    });

    const fBtn = document.getElementById("btnFooterBar");
    const fLbl = document.getElementById("lblFooterState");
    if (showFooterBar) {
        fBtn.className = "btn-brutal w-full px-3 py-2 bg-[#FCD34D] text-black border-2 border-black shadow-[2px_2px_0_#000] flex items-center justify-between text-[10.5px] font-extrabold uppercase cursor-pointer";
        fLbl.textContent = "ON";
        fLbl.className = "px-1.5 py-0.5 bg-black text-[#FCD34D] text-[9px]";
    } else {
        fBtn.className = "btn-brutal w-full px-3 py-2 bg-[#162C4E] text-white border-2 border-black shadow-[2px_2px_0_#000] flex items-center justify-between text-[10.5px] font-extrabold uppercase cursor-pointer";
        fLbl.textContent = "POLOS";
        fLbl.className = "px-1.5 py-0.5 bg-[#081426] text-slate-400 text-[9px]";
    }

    const gBtn = document.getElementById("btnGuides");
    const gLbl = document.getElementById("lblGuidesState");
    if (showGuides) {
        gBtn.className = "btn-brutal w-full px-3 py-2 bg-[#FCD34D] text-black border-2 border-black shadow-[2px_2px_0_#000] flex items-center justify-between text-[10.5px] font-extrabold uppercase cursor-pointer";
        gLbl.textContent = "ON";
        gLbl.className = "px-1.5 py-0.5 bg-black text-[#FCD34D] text-[9px]";
    } else {
        gBtn.className = "btn-brutal w-full px-3 py-2 bg-[#162C4E] text-white border-2 border-black shadow-[2px_2px_0_#000] flex items-center justify-between text-[10.5px] font-extrabold uppercase cursor-pointer";
        gLbl.textContent = "OFF";
        gLbl.className = "px-1.5 py-0.5 bg-[#081426] text-slate-400 text-[9px]";
    }

    const vAll = document.getElementById("view-all");
    const vSin = document.getElementById("view-single");
    vAll.className = viewMode === "all"
        ? "px-2.5 py-1 border border-black bg-[#FCD34D] text-[#091529] text-[10px] font-extrabold uppercase cursor-pointer"
        : "px-2.5 py-1 border border-black bg-[#162C4E] text-white text-[10px] font-extrabold uppercase cursor-pointer";
    vSin.className = viewMode === "single"
        ? "px-2.5 py-1 border border-black bg-[#FCD34D] text-[#091529] text-[10px] font-extrabold uppercase cursor-pointer"
        : "px-2.5 py-1 border border-black bg-[#162C4E] text-white text-[10px] font-extrabold uppercase cursor-pointer";
}

function renderStageOnly() {
    const host = document.getElementById("stageHost");
    if (viewMode === "single") {
        const f = getActiveFrame();
        host.innerHTML = `
        <div class="flex flex-col items-center gap-3">
            <div class="flex items-center gap-2">
                <button type="button" onclick="selectActiveFrame(${f.id === 1 ? 3 : f.id - 1})" class="px-3 py-1 bg-[#0F233C] border border-black text-xs font-extrabold text-white cursor-pointer">&larr;</button>
                <span class="px-3 py-1 bg-[#0F233C] border border-black text-xs font-extrabold text-[#FCD34D] uppercase">Bingkai ${f.id} • ${escapeXml(f.filename)}</span>
                <button type="button" onclick="selectActiveFrame(${f.id === 3 ? 1 : f.id + 1})" class="px-3 py-1 bg-[#0F233C] border border-black text-xs font-extrabold text-white cursor-pointer">&rarr;</button>
            </div>
            <div class="a5-svg-host w-full max-w-[490px] shadow-[0_24px_60px_rgba(0,0,0,0.65)] border-2 border-[#FCD34D]">
                ${generatePosterSvg(f, showGuides, false)}
            </div>
        </div>`;
        return;
    }

    host.innerHTML = `
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 items-start">
        ${framesState.map(f => {
            const isAct = f.id === activeFrameId;
            const ringCls = isAct
                ? "border-[3px] border-[#FCD34D] shadow-[0_20px_50px_rgba(252,211,77,0.18)]"
                : "border-2 border-white/15 opacity-95 hover:opacity-100 hover:border-sky-400/60";
            return `
            <div class="flex flex-col gap-2">
                <div class="flex items-center justify-between px-1">
                    <button type="button" onclick="selectActiveFrame(${f.id})" class="text-xs font-extrabold uppercase tracking-wide ${isAct ? 'text-[#FCD34D]' : 'text-slate-300 hover:text-white'} cursor-pointer">
                        ${isAct ? '● ' : ''}Bingkai ${f.id} — ${escapeXml(f.filename)}
                    </button>
                    <button type="button" onclick="activeFrameId=${f.id}; setViewMode('single'); syncSidebarInputsFromFrame();" class="text-[10px] font-bold px-2 py-0.5 bg-[#0F233C] border border-white/20 text-sky-200 hover:bg-[#163560] cursor-pointer">
                        Fokus
                    </button>
                </div>
                <div onclick="selectActiveFrame(${f.id})" class="a5-svg-host cursor-pointer transition-all ${ringCls}">
                    ${generatePosterSvg(f, showGuides, false)}
                </div>
            </div>`;
        }).join("")}
    </div>`;
}

function renderStudio() {
    syncButtonStates();
    renderStageOnly();
}

selectActiveFrame(1);
if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(renderStageOnly);
}
</script>
