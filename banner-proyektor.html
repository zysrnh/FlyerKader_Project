<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner Proyektor Studio — HIMA Informatika</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Chakra+Petch:wght@700&family=JetBrains+Mono:wght@600;700;800&family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Silkscreen:wght@700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #081426;
        }
        .workspace-stage {
            background-color: #081426;
            background-image: radial-gradient(rgba(56, 189, 248, 0.16) 1.2px, transparent 1.2px);
            background-size: 20px 20px;
        }
        .btn-brutal {
            transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.12s ease;
        }
        .btn-brutal:hover { transform: translate(-1px, -1px); }
        .btn-brutal:active { transform: translate(2px, 2px); box-shadow: none !important; }
        .builder-scroll::-webkit-scrollbar { width: 6px; }
        .builder-scroll::-webkit-scrollbar-track { background: #0B192E; }
        .builder-scroll::-webkit-scrollbar-thumb { background: #2A82C6; }
        .stage-svg-host svg {
            width: 100%;
            height: auto;
            display: block;
        }
        #fsSvgHost svg {
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            display: block;
        }
    </style>
</head>
<body class="h-screen overflow-hidden bg-[#081426] text-white flex">

    <!-- MOBILE BACKDROP -->
    <div id="mobileBackdrop" onclick="toggleMobileSidebar(false)" class="fixed inset-0 z-30 bg-black/60 hidden lg:hidden"></div>

    <!-- LEFT SIDEBAR -->
    <aside id="builderSidebar" class="fixed lg:static inset-y-0 left-0 z-40 w-[345px] xl:w-[370px] bg-[#0F233C] border-r-[3px] border-black flex flex-col shrink-0 -translate-x-full lg:translate-x-0 transition-transform duration-200">

        <!-- Brand Header -->
        <div class="h-16 px-4 bg-[#0B192E] border-b-[3px] border-black flex items-center justify-between shrink-0">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 bg-white border-2 border-black p-1 shadow-[2px_2px_0_#000000] shrink-0 flex items-center justify-center">
                    <img id="sidebarLogo" alt="HIMA IF" class="w-full h-full object-contain">
                </div>
                <div class="min-w-0">
                    <span class="text-sm font-extrabold uppercase tracking-wider text-white block leading-none">
                        Banner Proyektor
                    </span>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-[#38BDF8] block mt-1 leading-none">
                        Stage Widescreen • 16:9 / 4:3
                    </span>
                </div>
            </div>
            <button type="button" onclick="toggleMobileSidebar(false)" class="lg:hidden px-2.5 py-1 bg-white text-black border-2 border-black text-xs font-extrabold cursor-pointer">✕</button>
        </div>

        <!-- Scrollable Controls -->
        <div class="builder-scroll flex-1 overflow-y-auto p-4 space-y-5">

            <!-- 0. PILIH STYLE LAYOUT (5 LAYOUT DARI CONTOH STUDIO) -->
            <div class="space-y-2">
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-extrabold uppercase tracking-wider text-[#93C5FD]">0. Style Layout Banner</span>
                    <span id="lblActiveLayout" class="text-[10px] font-mono text-[#FCD34D]">layout-1</span>
                </div>
                <div class="grid grid-cols-2 gap-1.5">
                    <button type="button" onclick="setLayout(1)" id="btn-layout-1" class="lay-btn btn-brutal px-2.5 py-2 bg-[#FCD34D] text-black border-2 border-black shadow-[3px_3px_0_#000] text-left cursor-pointer">
                        <span class="text-[10.5px] font-extrabold uppercase block">Layout 1</span>
                        <span class="text-[9px] font-bold opacity-80 block">Window Hero</span>
                    </button>
                    <button type="button" onclick="setLayout(2)" id="btn-layout-2" class="lay-btn btn-brutal px-2.5 py-2 bg-[#162C4E] text-white border-2 border-black shadow-[2px_2px_0_#000] text-left cursor-pointer">
                        <span class="text-[10.5px] font-extrabold uppercase block">Layout 2</span>
                        <span class="text-[9px] font-bold opacity-80 block">Retro Pop-up</span>
                    </button>
                    <button type="button" onclick="setLayout(3)" id="btn-layout-3" class="lay-btn btn-brutal px-2.5 py-2 bg-[#162C4E] text-white border-2 border-black shadow-[2px_2px_0_#000] text-left cursor-pointer">
                        <span class="text-[10.5px] font-extrabold uppercase block">Layout 3</span>
                        <span class="text-[9px] font-bold opacity-80 block">Bubble Pop</span>
                    </button>
                    <button type="button" onclick="setLayout(4)" id="btn-layout-4" class="lay-btn btn-brutal px-2.5 py-2 bg-[#162C4E] text-white border-2 border-black shadow-[2px_2px_0_#000] text-left cursor-pointer">
                        <span class="text-[10.5px] font-extrabold uppercase block">Layout 4</span>
                        <span class="text-[9px] font-bold opacity-80 block">IG Stack Split</span>
                    </button>
                    <button type="button" onclick="setLayout(5)" id="btn-layout-5" class="lay-btn col-span-2 btn-brutal px-2.5 py-2 bg-[#162C4E] text-white border-2 border-black shadow-[2px_2px_0_#000] flex items-center justify-between text-left cursor-pointer">
                        <span>
                            <span class="text-[10.5px] font-extrabold uppercase block">Layout 5</span>
                            <span class="text-[9px] font-bold opacity-80 block">Mading Pin 3D Stage</span>
                        </span>
                        <span class="text-[9px] font-extrabold uppercase px-1.5 py-0.5 bg-[#CA2C2A] text-white border border-black">3D PIN</span>
                    </button>
                </div>
            </div>

            <!-- 1. TEMA WARNA -->
            <div class="space-y-2 pt-3 border-t-2 border-white/10">
                <span class="text-[11px] font-extrabold uppercase tracking-wider text-[#93C5FD] block">1. Tema Pewarnaan</span>
                <div class="grid grid-cols-1 gap-1.5">
                    <button type="button" onclick="setTheme('neubrutalism')" id="btn-thm-neubrutalism" class="thm-btn btn-brutal px-3 py-2 bg-[#FCD34D] text-black border-2 border-black shadow-[3px_3px_0_#000] flex items-center justify-between cursor-pointer">
                        <span class="text-[11px] font-extrabold uppercase">Neubrutalism HIMA IF</span>
                        <span class="flex gap-1"><span class="w-3.5 h-3.5 bg-[#FFFFFF] border border-black"></span><span class="w-3.5 h-3.5 bg-[#CA2C2A] border border-black"></span><span class="w-3.5 h-3.5 bg-[#16488E] border border-black"></span></span>
                    </button>
                    <button type="button" onclick="setTheme('dark-code')" id="btn-thm-dark-code" class="thm-btn btn-brutal px-3 py-2 bg-[#162C4E] text-white border-2 border-black shadow-[2px_2px_0_#000] flex items-center justify-between cursor-pointer">
                        <span class="text-[11px] font-extrabold uppercase">Dark Code (Ruang Gelap)</span>
                        <span class="flex gap-1"><span class="w-3.5 h-3.5 bg-[#0B192E] border border-black"></span><span class="w-3.5 h-3.5 bg-[#38BDF8] border border-black"></span><span class="w-3.5 h-3.5 bg-[#FCD34D] border border-black"></span></span>
                    </button>
                    <button type="button" onclick="setTheme('modern')" id="btn-thm-modern" class="thm-btn btn-brutal px-3 py-2 bg-[#162C4E] text-white border-2 border-black shadow-[2px_2px_0_#000] flex items-center justify-between cursor-pointer">
                        <span class="text-[11px] font-extrabold uppercase">Modern Clean Blue</span>
                        <span class="flex gap-1"><span class="w-3.5 h-3.5 bg-[#0D2D5E] border border-black"></span><span class="w-3.5 h-3.5 bg-[#FFFFFF] border border-black"></span><span class="w-3.5 h-3.5 bg-[#FDD34D] border border-black"></span></span>
                    </button>
                    <button type="button" onclick="setTheme('glass')" id="btn-thm-glass" class="thm-btn btn-brutal px-3 py-2 bg-[#162C4E] text-white border-2 border-black shadow-[2px_2px_0_#000] flex items-center justify-between cursor-pointer">
                        <span class="text-[11px] font-extrabold uppercase">Glassmorphism Ocean</span>
                        <span class="flex gap-1"><span class="w-3.5 h-3.5 bg-[#0D356F] border border-black"></span><span class="w-3.5 h-3.5 bg-[#BAE6FD] border border-black"></span><span class="w-3.5 h-3.5 bg-[#FFFFFF] border border-black"></span></span>
                    </button>
                </div>
            </div>

            <!-- 2. RASIO LAYAR PROYEKTOR -->
            <div class="space-y-2 pt-3 border-t-2 border-white/10">
                <span class="text-[11px] font-extrabold uppercase tracking-wider text-[#93C5FD] block">2. Layar Proyektor</span>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="setRatio('16-9')" id="btn-ratio-16-9" class="ratio-btn btn-brutal py-2 px-2 bg-[#CA2C2A] text-white border-2 border-black shadow-[3px_3px_0_#000] text-center cursor-pointer">
                        <span class="text-xs font-extrabold block">16:9 FHD</span>
                        <span class="text-[9.5px] opacity-85">1920 × 1080 px</span>
                    </button>
                    <button type="button" onclick="setRatio('4-3')" id="btn-ratio-4-3" class="ratio-btn btn-brutal py-2 px-2 bg-[#162C4E] text-white border-2 border-black shadow-[2px_2px_0_#000] text-center cursor-pointer">
                        <span class="text-xs font-extrabold block">4:3 Klasik</span>
                        <span class="text-[9.5px] opacity-85">1600 × 1200 px</span>
                    </button>
                </div>
            </div>

            <!-- 3. PRESET SESI ACARA CEPAT -->
            <div class="space-y-2 pt-3 border-t-2 border-white/10">
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-extrabold uppercase tracking-wider text-[#93C5FD]">3. Preset Layar Acara</span>
                    <span id="lblPreset" class="text-[10px] font-mono text-[#FCD34D]">main-event</span>
                </div>
                <div class="grid grid-cols-2 gap-1.5">
                    <button type="button" onclick="applySessionPreset('main')" id="pre-main" class="pre-btn btn-brutal py-1.5 px-2 bg-[#FCD34D] text-black border-2 border-black text-[10px] font-extrabold uppercase cursor-pointer">Main Banner</button>
                    <button type="button" onclick="applySessionPreset('regis')" id="pre-regis" class="pre-btn btn-brutal py-1.5 px-2 bg-[#162C4E] text-white border-2 border-black text-[10px] font-extrabold uppercase cursor-pointer">Open Gate</button>
                    <button type="button" onclick="applySessionPreset('materi')" id="pre-materi" class="pre-btn btn-brutal py-1.5 px-2 bg-[#162C4E] text-white border-2 border-black text-[10px] font-extrabold uppercase cursor-pointer">Sesi Materi</button>
                    <button type="button" onclick="applySessionPreset('ishoma')" id="pre-ishoma" class="pre-btn btn-brutal py-1.5 px-2 bg-[#162C4E] text-white border-2 border-black text-[10px] font-extrabold uppercase cursor-pointer">Break / ISHOMA</button>
                    <button type="button" onclick="applySessionPreset('closing')" id="pre-closing" class="pre-btn col-span-2 btn-brutal py-1.5 px-2 bg-[#162C4E] text-white border-2 border-black text-[10px] font-extrabold uppercase cursor-pointer">Closing Ceremony</button>
                </div>
            </div>

            <!-- 4. EDIT TEKS LIVE -->
            <div class="space-y-2.5 pt-3 border-t-2 border-white/10">
                <span class="text-[11px] font-extrabold uppercase tracking-wider text-[#93C5FD] block">4. Edit Teks Banner Live</span>
                <div>
                    <label class="text-[10px] font-bold uppercase text-white/60 block mb-1">Badge / Label Atas</label>
                    <input id="inBadge" type="text" oninput="onLiveEdit()" class="w-full px-2.5 py-1.5 bg-[#081426] border-2 border-black text-white text-xs font-bold uppercase focus:outline-none focus:border-[#FCD34D]">
                </div>
                <div>
                    <label class="text-[10px] font-bold uppercase text-white/60 block mb-1">Judul Utama Proyektor</label>
                    <input id="inTitle" type="text" oninput="onLiveEdit()" class="w-full px-2.5 py-1.5 bg-[#081426] border-2 border-black text-white text-xs font-extrabold uppercase focus:outline-none focus:border-[#FCD34D]">
                </div>
                <div>
                    <label class="text-[10px] font-bold uppercase text-white/60 block mb-1">Tema / Subjudul</label>
                    <input id="inSub" type="text" oninput="onLiveEdit()" class="w-full px-2.5 py-1.5 bg-[#081426] border-2 border-black text-white text-xs font-semibold focus:outline-none focus:border-[#FCD34D]">
                </div>
                <div>
                    <label class="text-[10px] font-bold uppercase text-white/60 block mb-1">Keterangan / Tagline</label>
                    <input id="inTag" type="text" oninput="onLiveEdit()" class="w-full px-2.5 py-1.5 bg-[#081426] border-2 border-black text-white text-xs focus:outline-none focus:border-[#FCD34D]">
                </div>

                <!-- Optional Schedule & Location (OFF by default!) -->
                <div class="pt-1 space-y-2">
                    <button type="button" onclick="toggleSchedule()" id="btnSched" class="btn-brutal w-full px-3 py-1.5 bg-[#CA2C2A] text-white border-2 border-black shadow-[2px_2px_0_#000] flex items-center justify-between text-[10px] font-extrabold uppercase cursor-pointer">
                        <span>Info Jadwal &amp; Lokasi</span>
                        <span id="lblSchedState" class="px-1.5 py-0.5 bg-black/40 text-white text-[9px]">OFF</span>
                    </button>
                    <div id="schedInputsWrap" class="grid grid-cols-2 gap-1.5 opacity-40">
                        <input id="inDate" type="text" oninput="onLiveEdit()" placeholder="Tanggal" class="col-span-2 px-2 py-1 bg-[#081426] border border-black text-white text-[11px]">
                        <input id="inTime" type="text" oninput="onLiveEdit()" placeholder="Jam" class="px-2 py-1 bg-[#081426] border border-black text-white text-[11px]">
                        <input id="inLoc" type="text" oninput="onLiveEdit()" placeholder="Lokasi" class="px-2 py-1 bg-[#081426] border border-black text-white text-[11px]">
                    </div>
                </div>

                <button type="button" onclick="toggleOverscan()" id="btnOverscan" class="btn-brutal w-full px-3 py-1.5 bg-[#162C4E] text-white border-2 border-black shadow-[2px_2px_0_#000] flex items-center justify-between text-[10px] font-extrabold uppercase cursor-pointer">
                    <span>Garis Aman Proyektor (5%)</span>
                    <span id="lblOverscanState" class="px-1.5 py-0.5 bg-[#081426] text-slate-400 text-[9px]">OFF</span>
                </button>
            </div>
        </div>

        <!-- Sticky Bottom Actions -->
        <div class="p-4 bg-[#0B192E] border-t-[3px] border-black space-y-2 shrink-0">
            <button type="button" onclick="enterProjectorMode()" class="btn-brutal w-full py-2.5 bg-[#FCD34D] hover:bg-[#FDE047] text-[#091529] border-2 border-black shadow-[3px_3px_0_#000] text-xs font-extrabold uppercase tracking-wider cursor-pointer">
                Tampilkan Fullscreen Proyektor
            </button>
            <div class="grid grid-cols-2 gap-2">
                <button type="button" onclick="downloadSvg()" class="btn-brutal py-2 bg-white text-[#091529] border-2 border-black shadow-[2px_2px_0_#000] text-[10.5px] font-extrabold uppercase cursor-pointer">
                    Unduh SVG
                </button>
                <button type="button" onclick="downloadPng()" class="btn-brutal py-2 bg-[#15803D] hover:bg-[#166534] text-white border-2 border-black shadow-[2px_2px_0_#000] text-[10.5px] font-extrabold uppercase cursor-pointer">
                    PNG (<span id="lblPngRes">1920px</span>)
                </button>
            </div>
        </div>
    </aside>

    <!-- RIGHT WORKSPACE STAGE -->
    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">

        <!-- Unified 3-Page Navigation Top Bar -->
        <div class="h-12 px-4 bg-[#0B192E] border-b-2 border-black flex items-center justify-between gap-3 shrink-0">
            <div class="flex items-center gap-2.5 min-w-0">
                <button type="button" onclick="toggleMobileSidebar(true)" class="lg:hidden btn-brutal px-3 py-1 bg-[#FCD34D] text-black border-2 border-black text-xs font-extrabold uppercase shadow-[2px_2px_0_#000000] cursor-pointer">
                    ☰ Editor
                </button>
                <div class="flex items-center gap-1.5">
                    <a href="index.html" class="btn-brutal px-2.5 py-1 bg-[#162C4E] hover:bg-[#1E3B68] text-sky-200 border border-black text-[10px] font-extrabold uppercase tracking-wider shadow-[2px_2px_0_#000000] whitespace-nowrap">Flyer &amp; Story</a>
                    <a href="poster-a5-kode.html" class="btn-brutal px-2.5 py-1 bg-[#162C4E] hover:bg-[#1E3B68] text-sky-200 border border-black text-[10px] font-extrabold uppercase tracking-wider shadow-[2px_2px_0_#000000] whitespace-nowrap">Poster A5</a>
                    <span class="px-2.5 py-1 bg-[#FCD34D] text-[#091529] border border-black text-[10px] font-extrabold uppercase tracking-wider whitespace-nowrap">Banner Proyektor</span>
                </div>
            </div>

            <div class="flex items-center gap-2 text-[11px] font-mono text-[#38BDF8] shrink-0">
                <span id="stageResLabel">16:9 FHD • 1920 × 1080 px</span>
            </div>
        </div>

        <!-- Live Widescreen Preview Canvas Stage -->
        <div class="workspace-stage flex-1 overflow-auto p-5 sm:p-8 flex flex-col items-center justify-center">
            <div id="stageBannerWrap" class="w-full max-w-[1060px] shadow-[0_28px_70px_rgba(0,0,0,0.68)] border-2 border-black stage-svg-host bg-[#0B192E]"></div>
        </div>
    </div>

    <!-- FULLSCREEN PROJECTOR PRESENTATION OVERLAY -->
    <div id="projectorOverlay" class="hidden fixed inset-0 z-50 bg-black flex items-center justify-center">
        <div id="fsSvgHost" class="w-full h-full flex items-center justify-center"></div>

        <!-- Hover Floating Quick Switcher on Projector -->
        <div class="fixed top-4 right-4 z-50 opacity-20 hover:opacity-100 transition-opacity duration-200 flex flex-wrap items-center gap-1.5 bg-[#0B192E]/90 border-2 border-black p-2 shadow-xl backdrop-blur">
            <button type="button" onclick="applySessionPreset('main')" class="px-2 py-1 bg-[#162C4E] hover:bg-[#1E4B8A] text-[10px] font-bold text-white border border-black cursor-pointer">Main</button>
            <button type="button" onclick="applySessionPreset('regis')" class="px-2 py-1 bg-[#162C4E] hover:bg-[#1E4B8A] text-[10px] font-bold text-white border border-black cursor-pointer">Open Gate</button>
            <button type="button" onclick="applySessionPreset('materi')" class="px-2 py-1 bg-[#162C4E] hover:bg-[#1E4B8A] text-[10px] font-bold text-white border border-black cursor-pointer">Materi</button>
            <button type="button" onclick="applySessionPreset('ishoma')" class="px-2 py-1 bg-[#162C4E] hover:bg-[#1E4B8A] text-[10px] font-bold text-white border border-black cursor-pointer">ISHOMA</button>
            <button type="button" onclick="applySessionPreset('closing')" class="px-2 py-1 bg-[#162C4E] hover:bg-[#1E4B8A] text-[10px] font-bold text-white border border-black cursor-pointer">Closing</button>
            <span class="w-[1px] h-5 bg-white/20 mx-0.5"></span>
            <button type="button" onclick="exitProjectorMode()" class="px-2.5 py-1 bg-[#CA2C2A] text-[10px] font-extrabold text-white border border-black cursor-pointer">Keluar (Esc)</button>
        </div>

function escapeXml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&apos;");
}

const _mCan = document.createElement("canvas");
const _mCtx = _mCan.getContext("2d");

function fitFontSize(text, weight, fam, maxW, startPx, minPx) {
    let px = startPx;
    while (px > minPx) {
        _mCtx.font = `${weight} ${px}px ${fam}`;
        if (_mCtx.measureText(text).width <= maxW) break;
        px -= 3;
    }
    return px;
}

function wrapLines(text, fontSpec, maxW) {
    _mCtx.font = fontSpec;
    const words = String(text || "").trim().split(/\s+/);
    const out = [];
    let cur = "";
    for (const w of words) {
        const test = cur ? cur + " " + w : w;
        if (_mCtx.measureText(test).width <= maxW) cur = test;
        else { if (cur) out.push(cur); cur = w; }
    }
    if (cur) out.push(cur);
    return out.length ? out : [""];
}

// Unified Graphics Adapter: Zero duplication between live SVG & Full-HD Canvas 2D PNG!
function makeSvgAdapter(W, H, uid) {
    const defs = [];
    const body = [];
    let gid = 0;

    function resolveColor(col) {
        if (!col || typeof col !== "object") return col || "none";
        const id = `g_${uid}_${gid++}`;
        if (col.type === "linear") {
            const stops = col.stops.map(([o, c]) => `<stop offset="${Math.round(o*100)}%" stop-color="${c}"/>`).join("");
            defs.push(`<linearGradient id="${id}" x1="${col.x1||'0%'}" y1="${col.y1||'0%'}" x2="${col.x2||'100%'}" y2="${col.y2||'100%'}">${stops}</linearGradient>`);
        } else if (col.type === "radial") {
            const stops = col.stops.map(([o, c]) => `<stop offset="${Math.round(o*100)}%" stop-color="${c}"/>`).join("");
            defs.push(`<radialGradient id="${id}" cx="${col.cx||'50%'}" cy="${col.cy||'50%'}" r="${col.r||'65%'}">${stops}</radialGradient>`);
        }
        return `url(#${id})`;
    }
    defs.push(`<filter id="soft_${uid}" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#05132C" flood-opacity="0.34"/></filter>`);

    return {
        dotPattern(step, rad, col) {
            const pid = `dp_${uid}_${gid++}`;
            defs.push(`<pattern id="${pid}" width="${step}" height="${step}" patternUnits="userSpaceOnUse"><circle cx="${step/2}" cy="${step/2}" r="${rad}" fill="${col}"/></pattern>`);
            body.push(`<rect width="${W}" height="${H}" fill="url(#${pid})"/>`);
        },
        grid(x, y, w, h, step, col, sw = 1) {
            const pid = `gr_${uid}_${gid++}`;
            defs.push(`<pattern id="${pid}" width="${step}" height="${step}" patternUnits="userSpaceOnUse"><path d="M ${step} 0 L 0 0 0 ${step}" fill="none" stroke="${col}" stroke-width="${sw}"/></pattern>`);
            body.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#${pid})"/>`);
        },
        rect(x, y, w, h, o = {}) {
            const rx = Math.min(o.rx || 0, w / 2, h / 2);
            if (o.shdOff && o.shdOff > 0) {
                body.push(`<rect x="${x + o.shdOff}" y="${y + o.shdOff}" width="${w}" height="${h}" rx="${rx}" fill="${o.shdCol || '#000000'}"/>`);
            }
            const fl = o.soft ? ` filter="url(#soft_${uid})"` : "";
            const op = o.alpha != null ? ` opacity="${o.alpha}"` : "";
            body.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${resolveColor(o.fill)}" stroke="${o.stroke || 'none'}" stroke-width="${o.sw || 0}"${fl}${op}/>`);
        },
        circle(cx, cy, r, o = {}) {
            const op = o.alpha != null ? ` opacity="${o.alpha}"` : "";
            body.push(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${resolveColor(o.fill)}" stroke="${o.stroke || 'none'}" stroke-width="${o.sw || 0}"${op}/>`);
        },
        line(x1, y1, x2, y2, o = {}) {
            const op = o.alpha != null ? ` opacity="${o.alpha}"` : "";
            const da = o.dash ? ` stroke-dasharray="${o.dash}"` : "";
            body.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.stroke || '#000'}" stroke-width="${o.sw || 2}"${da}${op}/>`);
        },
        polygon(pts, o = {}) {
            const s = pts.map(p => p.join(",")).join(" ");
            const op = o.alpha != null ? ` opacity="${o.alpha}"` : "";
            body.push(`<polygon points="${s}" fill="${resolveColor(o.fill)}" stroke="${o.stroke || 'none'}" stroke-width="${o.sw || 0}" stroke-linejoin="round"${op}/>`);
        },
        path(d, o = {}) {
            const tr = o.tr ? ` transform="${o.tr}"` : "";
            const op = o.alpha != null ? ` opacity="${o.alpha}"` : "";
            const fl = o.soft ? ` filter="url(#soft_${uid})"` : "";
            body.push(`<path d="${d}" fill="${resolveColor(o.fill)}" stroke="${o.stroke || 'none'}" stroke-width="${o.sw || 0}" stroke-linejoin="round" stroke-linecap="round"${tr}${op}${fl}/>`);
        },
        text(str, x, y, o = {}) {
            const fam = o.fam || "'Archivo Black', sans-serif";
            const wt = o.wt || 900;
            const px = o.px || 48;
            const anchor = o.align === "center" ? "middle" : (o.align === "right" ? "end" : "start");
            const ls = o.ls ? ` letter-spacing="${o.ls}"` : "";
            const op = o.alpha != null ? ` opacity="${o.alpha}"` : "";
            if (o.shdOff && o.shdOff > 0) {
                const sStroke = o.shdStroke ? ` stroke="${o.shdStroke}" stroke-width="${o.shdSW || o.sw || 0}" stroke-linejoin="round" style="paint-order:stroke fill;"` : "";
                body.push(`<text x="${x + o.shdOff}" y="${y + o.shdOff}" text-anchor="${anchor}" font-family="${fam}" font-weight="${wt}" font-size="${px}"${ls} fill="${o.shdCol || '#000000'}"${sStroke}${op}>${escapeXml(str)}</text>`);
            }
            const mainStroke = (o.sw && o.sw > 0 && o.stroke && o.stroke !== "transparent")
                ? ` stroke="${o.stroke}" stroke-width="${o.sw}" stroke-linejoin="round" style="paint-order:stroke fill;"`
                : "";
            body.push(`<text x="${x}" y="${y}" text-anchor="${anchor}" font-family="${fam}" font-weight="${wt}" font-size="${px}"${ls} fill="${o.fill || '#FFFFFF'}"${mainStroke}${op}>${escapeXml(str)}</text>`);
        },
        logo(key, x, y, w, h) {
            body.push(`<image href="${LOGOS_B64[key]}" x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid meet"/>`);
        },
        pushRot(deg, cx, cy) { body.push(`<g transform="rotate(${deg} ${cx} ${cy})">`); },
        popRot() { body.push(`</g>`); },
        pushTr(tx, ty, sc = 1) { body.push(`<g transform="translate(${tx}, ${ty}) scale(${sc})">`); },
        popTr() { body.push(`</g>`); },
        finish() {
            return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs>${defs.join("")}</defs>${body.join("\n")}</svg>`;
        }
    };
}

function makeCanvasAdapter(ctx, W, H) {
    function resolveFill(col, x, y, w, h) {
        if (!col || typeof col !== "object") return col;
        if (col.type === "linear") {
            const g = ctx.createLinearGradient(x, y, x + w, y + h);
            col.stops.forEach(([o, c]) => g.addColorStop(o, c));
            return g;
        }
        const cx = W * 0.5, cy = H * 0.42;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.72);
        col.stops.forEach(([o, c]) => g.addColorStop(o, c));
        return g;
    }
    function rr(x, y, w, h, r) {
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
        else ctx.rect(x, y, w, h);
    }
    function applySoft(soft) {
        if (soft) {
            ctx.shadowColor = "rgba(5,19,44,0.34)";
            ctx.shadowBlur = 28;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 14;
        }
    }
    function clearShadow() {
        ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
    }
    return {
        dotPattern(step, rad, col) {
            ctx.fillStyle = col;
            for (let py = step / 2; py < H; py += step) {
                for (let px = step / 2; px < W; px += step) {
                    ctx.beginPath(); ctx.arc(px, py, rad, 0, Math.PI * 2); ctx.fill();
                }
            }
        },
        grid(x, y, w, h, step, col, sw = 1) {
            ctx.save();
            ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
            ctx.strokeStyle = col; ctx.lineWidth = sw;
            ctx.beginPath();
            for (let gx = x; gx <= x + w; gx += step) { ctx.moveTo(gx, y); ctx.lineTo(gx, y + h); }
            for (let gy = y; gy <= y + h; gy += step) { ctx.moveTo(x, gy); ctx.lineTo(x + w, gy); }
            ctx.stroke();
            ctx.restore();
        },
        rect(x, y, w, h, o = {}) {
            const rx = Math.min(o.rx || 0, w / 2, h / 2);
            if (o.shdOff && o.shdOff > 0) {
                ctx.fillStyle = o.shdCol || "#000000";
                rr(x + o.shdOff, y + o.shdOff, w, h, rx); ctx.fill();
            }
            ctx.save();
            if (o.alpha != null) ctx.globalAlpha = o.alpha;
            if (o.fill && o.fill !== "none") {
                applySoft(o.soft);
                ctx.fillStyle = resolveFill(o.fill, x, y, w, h);
                rr(x, y, w, h, rx); ctx.fill();
                clearShadow();
            }
            if (o.sw && o.sw > 0 && o.stroke && o.stroke !== "none" && o.stroke !== "transparent") {
                ctx.strokeStyle = o.stroke; ctx.lineWidth = o.sw;
                rr(x, y, w, h, rx); ctx.stroke();
            }
            ctx.restore();
        },
        circle(cx, cy, r, o = {}) {
            ctx.save();
            if (o.alpha != null) ctx.globalAlpha = o.alpha;
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
            if (o.fill && o.fill !== "none") { ctx.fillStyle = resolveFill(o.fill, cx - r, cy - r, r * 2, r * 2); ctx.fill(); }
            if (o.sw && o.sw > 0 && o.stroke && o.stroke !== "none" && o.stroke !== "transparent") {
                ctx.strokeStyle = o.stroke; ctx.lineWidth = o.sw; ctx.stroke();
            }
            ctx.restore();
        },
        line(x1, y1, x2, y2, o = {}) {
            ctx.save();
            if (o.alpha != null) ctx.globalAlpha = o.alpha;
            if (o.dash) ctx.setLineDash(String(o.dash).split(" ").map(Number));
            ctx.strokeStyle = o.stroke || "#000"; ctx.lineWidth = o.sw || 2;
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            ctx.restore();
        },
        polygon(pts, o = {}) {
            ctx.save();
            if (o.alpha != null) ctx.globalAlpha = o.alpha;
            ctx.beginPath();
            pts.forEach(([px, py], i) => i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py));
            ctx.closePath();
            ctx.lineJoin = "round";
            if (o.fill && o.fill !== "none") { ctx.fillStyle = o.fill; ctx.fill(); }
            if (o.sw && o.sw > 0 && o.stroke && o.stroke !== "none") { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.sw; ctx.stroke(); }
            ctx.restore();
        },
        path(d, o = {}) {
            ctx.save();
            if (o.alpha != null) ctx.globalAlpha = o.alpha;
            applySoft(o.soft);
            const p = new Path2D(d);
            ctx.lineJoin = "round"; ctx.lineCap = "round";
            if (o.fill && o.fill !== "none") { ctx.fillStyle = o.fill; ctx.fill(p); }
            clearShadow();
            if (o.sw && o.sw > 0 && o.stroke && o.stroke !== "none" && o.stroke !== "transparent") {
                ctx.strokeStyle = o.stroke; ctx.lineWidth = o.sw; ctx.stroke(p);
            }
            ctx.restore();
        },
        text(str, x, y, o = {}) {
            const fam = o.fam || "'Archivo Black', sans-serif";
            const wt = o.wt || 900;
            const px = o.px || 48;
            ctx.save();
            if (o.alpha != null) ctx.globalAlpha = o.alpha;
            ctx.font = `${wt} ${px}px ${fam}`;
            ctx.textAlign = o.align || "left";
            ctx.textBaseline = "alphabetic";
            ctx.lineJoin = "round";
            if (o.shdOff && o.shdOff > 0) {
                if (o.shdStroke && (o.shdSW || o.sw)) {
                    ctx.strokeStyle = o.shdStroke;
                    ctx.lineWidth = o.shdSW || o.sw;
                    ctx.strokeText(str, x + o.shdOff, y + o.shdOff);
                }
                ctx.fillStyle = o.shdCol || "#000000";
                ctx.fillText(str, x + o.shdOff, y + o.shdOff);
            }
            if (o.sw && o.sw > 0 && o.stroke && o.stroke !== "transparent") {
                ctx.strokeStyle = o.stroke; ctx.lineWidth = o.sw;
                ctx.strokeText(str, x, y);
            }
            ctx.fillStyle = o.fill || "#FFFFFF";
            ctx.fillText(str, x, y);
            ctx.restore();
        },
        logo(key, x, y, w, h) {
            const im = LOGO_IMAGES[key];
            if (!im) return;
            const iw = im.naturalWidth || 100, ih = im.naturalHeight || 100;
            const s = Math.min(w / iw, h / ih);
            ctx.drawImage(im, x + (w - iw * s) / 2, y + (h - ih * s) / 2, iw * s, ih * s);
        },
        pushRot(deg, cx, cy) { ctx.save(); ctx.translate(cx, cy); ctx.rotate(deg * Math.PI / 180); ctx.translate(-cx, -cy); },
        popRot() { ctx.restore(); },
        pushTr(tx, ty, sc = 1) { ctx.save(); ctx.translate(tx, ty); ctx.scale(sc, sc); },
        popTr() { ctx.restore(); }
    };
}

            fill: "#FFFFFF", stroke: "#0B1F40", sw: 10, shdOff: 5, shdCol: "#000000", shdStroke: "#000000", shdSW: 10, ls: 1.4
        });
        D.text(`"${state.tag}"`, W / 2, subY + 58, { align: "center", fam: "'Plus Jakarta Sans', sans-serif", wt: 700, px: 28, fill: "#FCD34D" });
        if (schedTxt) {
            D.text(schedTxt, W / 2, subY + 104, { align: "center", fam: "'JetBrains Mono', monospace", wt: 700, px: 22, fill: "#FFFFFF" });
        }

        // Open Footer Rule
        const fy = H - 78;
        D.line(110, fy - 34, W - 110, fy - 34, { stroke: "rgba(255,255,255,0.45)", sw: 2 });
        D.text("@hmif_LPKIA   |   GO.HMIF-LPKIA.MY.ID", W / 2, fy + 8, { align: "center", fam: "'Space Grotesk', sans-serif", wt: 700, px: 23, fill: "#FFFFFF" });
    }

    // 5% Projector Overscan Safe Guide
    if (includeGuides) {
        const mx = Math.round(W * 0.05), my = Math.round(H * 0.05);
        D.rect(mx, my, W - mx * 2, H - my * 2, { fill: "none", stroke: "#38BDF8", sw: 3, alpha: 0.75 });
    }
}

function generateBannerSvg(forExport = false) {
    const { W, H } = RATIOS[state.ratio] || RATIOS["16-9"];
    const uid = `bn_${state.layout}_${state.theme}_${state.ratio}_${forExport ? 'ex' : 'ui'}`;
    const D = makeSvgAdapter(W, H, uid);
    renderBannerScene(D, W, H, !forExport && state.showOverscan);
    return D.finish();
}

async function renderBannerPngDataUrl() {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await Promise.all(Object.values(LOGO_IMAGES).map(im => im.complete ? Promise.resolve() : new Promise(r => { im.onload = r; im.onerror = r; })));
    const { W, H } = RATIOS[state.ratio] || RATIOS["16-9"];
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const ctx = c.getContext("2d");
    const D = makeCanvasAdapter(ctx, W, H);
    renderBannerScene(D, W, H, false);
    return c.toDataURL("image/png");
}

async function renderBannerPngBlob() {
    const dataUrl = await renderBannerPngDataUrl();
    const res = await fetch(dataUrl);
    return res.blob();
}

function downloadSvg() {
    const txt = '<?xml version="1.0" encoding="UTF-8"?>\n' + generateBannerSvg(true);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([txt], { type: "image/svg+xml;charset=utf-8" }));
    a.download = `banner-proyektor-layout${state.layout}-${state.theme}-${state.ratio}.svg`;
    document.body.appendChild(a); a.click(); a.remove();
}

async function downloadPng() {
    const blob = await renderBannerPngBlob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `banner-proyektor-layout${state.layout}-${state.theme}-${state.ratio}.png`;
    document.body.appendChild(a); a.click(); a.remove();
}

// UI State Sync & Event Handlers
function toggleMobileSidebar(open) {
    const sb = document.getElementById("builderSidebar");
    const bd = document.getElementById("mobileBackdrop");
    if (open) { sb.classList.remove("-translate-x-full"); bd.classList.remove("hidden"); }
    else { sb.classList.add("-translate-x-full"); bd.classList.add("hidden"); }
}

function setLayout(n) { state.layout = n; renderStudio(); }
function setTheme(t) { state.theme = t; renderStudio(); }
function setRatio(r) { state.ratio = r; renderStudio(); }

function applySessionPreset(p) {
    state.preset = p;
    const d = SESSION_PRESETS[p] || SESSION_PRESETS.main;
    state.badge = d.badge;
    state.title = d.title;
    state.sub = d.sub;
    state.tag = d.tag;
    syncInputsFromState();
    renderStudio();
}

function toggleSchedule() { state.showSchedule = !state.showSchedule; renderStudio(); }
function toggleOverscan() { state.showOverscan = !state.showOverscan; renderStudio(); }

function onLiveEdit() {
    state.badge = document.getElementById("inBadge").value;
    state.title = document.getElementById("inTitle").value;
    state.sub = document.getElementById("inSub").value;
    state.tag = document.getElementById("inTag").value;
    state.date = document.getElementById("inDate").value;
    state.time = document.getElementById("inTime").value;
    state.loc = document.getElementById("inLoc").value;
    renderCanvasOnly();
}

function syncInputsFromState() {
    document.getElementById("inBadge").value = state.badge;
    document.getElementById("inTitle").value = state.title;
    document.getElementById("inSub").value = state.sub;
    document.getElementById("inTag").value = state.tag;
    document.getElementById("inDate").value = state.date;
    document.getElementById("inTime").value = state.time;
    document.getElementById("inLoc").value = state.loc;
}

function enterProjectorMode() {
    const ov = document.getElementById("projectorOverlay");
    ov.classList.remove("hidden");
    renderCanvasOnly();
    if (ov.requestFullscreen) {
        ov.requestFullscreen().catch(() => {});
    }
}

function exitProjectorMode() {
    const ov = document.getElementById("projectorOverlay");
    ov.classList.add("hidden");
    if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
    }
}

window.addEventListener("keydown", e => {
    if (e.key === "Escape") exitProjectorMode();
});
document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement) {
        document.getElementById("projectorOverlay").classList.add("hidden");
    }
});

function renderCanvasOnly() {
    const svg = generateBannerSvg(false);
    document.getElementById("stageBannerWrap").innerHTML = svg;
    if (!document.getElementById("projectorOverlay").classList.contains("hidden")) {
        document.getElementById("fsSvgHost").innerHTML = generateBannerSvg(true);
    }
}

function renderStudio() {
    document.getElementById("lblActiveLayout").textContent = `layout-${state.layout}`;
    document.getElementById("lblPreset").textContent = state.preset;
    const r = RATIOS[state.ratio] || RATIOS["16-9"];
    document.getElementById("stageResLabel").textContent = r.label;
    document.getElementById("lblPngRes").textContent = r.short;

    [1,2,3,4,5].forEach(i => {
        const b = document.getElementById(`btn-layout-${i}`);
        const col2 = i === 5 ? "col-span-2 flex items-center justify-between text-left" : "text-left";
        b.className = (i === state.layout)
            ? `lay-btn btn-brutal ${col2} px-2.5 py-2 bg-[#FCD34D] text-black border-2 border-black shadow-[3px_3px_0_#000] cursor-pointer`
            : `lay-btn btn-brutal ${col2} px-2.5 py-2 bg-[#162C4E] text-white border-2 border-black shadow-[2px_2px_0_#000] cursor-pointer`;
    });

    document.querySelectorAll(".thm-btn").forEach(b => {
        const k = b.id.replace("btn-thm-", "");
        b.className = (k === state.theme)
            ? "thm-btn btn-brutal px-3 py-2 bg-[#FCD34D] text-black border-2 border-black shadow-[3px_3px_0_#000] flex items-center justify-between cursor-pointer"
            : "thm-btn btn-brutal px-3 py-2 bg-[#162C4E] text-white border-2 border-black shadow-[2px_2px_0_#000] flex items-center justify-between cursor-pointer";
    });

    ["16-9", "4-3"].forEach(k => {
        const b = document.getElementById(`btn-ratio-${k}`);
        b.className = (k === state.ratio)
            ? "ratio-btn btn-brutal py-2 px-2 bg-[#CA2C2A] text-white border-2 border-black shadow-[3px_3px_0_#000] text-center cursor-pointer"
            : "ratio-btn btn-brutal py-2 px-2 bg-[#162C4E] text-white border-2 border-black shadow-[2px_2px_0_#000] text-center cursor-pointer";
    });

    document.querySelectorAll(".pre-btn").forEach(b => {
        const k = b.id.replace("pre-", "");
        const span = k === "closing" ? "col-span-2" : "";
        b.className = (k === state.preset)
            ? `pre-btn btn-brutal ${span} py-1.5 px-2 bg-[#FCD34D] text-black border-2 border-black text-[10px] font-extrabold uppercase cursor-pointer`
            : `pre-btn btn-brutal ${span} py-1.5 px-2 bg-[#162C4E] text-white border-2 border-black text-[10px] font-extrabold uppercase cursor-pointer`;
    });

    const sb = document.getElementById("btnSched");
    const sl = document.getElementById("lblSchedState");
    const sw = document.getElementById("schedInputsWrap");
    if (state.showSchedule) {
        sb.className = "btn-brutal w-full px-3 py-1.5 bg-[#15803D] text-white border-2 border-black shadow-[2px_2px_0_#000] flex items-center justify-between text-[10px] font-extrabold uppercase cursor-pointer";
        sl.textContent = "ON";
        sw.classList.remove("opacity-40");
    } else {
        sb.className = "btn-brutal w-full px-3 py-1.5 bg-[#CA2C2A] text-white border-2 border-black shadow-[2px_2px_0_#000] flex items-center justify-between text-[10px] font-extrabold uppercase cursor-pointer";
        sl.textContent = "OFF";
        sw.classList.add("opacity-40");
    }

    const ob = document.getElementById("btnOverscan");
    const ol = document.getElementById("lblOverscanState");
    if (state.showOverscan) {
        ob.className = "btn-brutal w-full px-3 py-1.5 bg-[#FCD34D] text-black border-2 border-black shadow-[2px_2px_0_#000] flex items-center justify-between text-[10px] font-extrabold uppercase cursor-pointer";
        ol.textContent = "ON";
        ol.className = "px-1.5 py-0.5 bg-black text-[#FCD34D] text-[9px]";
    } else {
        ob.className = "btn-brutal w-full px-3 py-1.5 bg-[#162C4E] text-white border-2 border-black shadow-[2px_2px_0_#000] flex items-center justify-between text-[10px] font-extrabold uppercase cursor-pointer";
        ol.textContent = "OFF";
        ol.className = "px-1.5 py-0.5 bg-[#081426] text-slate-400 text-[9px]";
    }

    renderCanvasOnly();
}

syncInputsFromState();
renderStudio();
if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(renderCanvasOnly);
}
</script>
</body>
</html>
