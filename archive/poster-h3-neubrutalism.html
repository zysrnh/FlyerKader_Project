<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown H-3 Kaderisasi (Neubrutalism) — HIMA Informatika LPKIA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;0,900;1,600;1,700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #0F2A4A;
        }
        .poster-canvas {
            width: 1080px;
            height: 1350px;
            background-color: #E8F2FA;
            background-image: radial-gradient(#1A467C 1.4px, transparent 1.4px);
            background-size: 24px 24px;
        }
        .h3-hard-shadow {
            text-shadow: 9px 9px 0 #FCD34D, 13px 13px 0 #000000;
        }
        .peek-hard-shadow {
            text-shadow: 4px 4px 0 #FCD34D;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#0F2A4A]">

    <!-- Fixed 1080x1350 Portrait 4:5 Artboard -->
    <main class="poster-canvas relative overflow-hidden flex flex-col justify-between px-[68px] pt-[48px] pb-[44px] text-black select-none">

        <!-- 1. Header (~8% height / ~108px) -->
        <header class="relative z-10 h-[104px] flex items-center justify-between bg-white border-[3px] border-black px-6 shadow-[6px_6px_0px_0px_#000000]">
            <div class="flex items-center">
                <div class="w-14 h-14 bg-[#F8FBFE] border-[2.5px] border-black flex items-center justify-center p-1.5 shadow-[3px_3px_0px_0px_#000000] shrink-0">
                    <img
                        src="../assets/logo-hima.png"
                        alt="Logo HIMA Informatika"
                        class="w-full h-full object-contain"
                    >
                </div>

                <div class="w-[2px] h-10 bg-black mx-5 shrink-0"></div>

                <div class="flex flex-col justify-center">
                    <span class="text-[22px] font-black uppercase leading-tight tracking-tight text-[#1A467C]">
                        HIMA Informatika
                    </span>
                    <span class="text-[13px] font-bold uppercase tracking-wider text-[#2A82C6] mt-0.5">
                        Institut Digital Ekonomi LPKIA
                    </span>
                </div>
            </div>

            <div class="bg-[#FCD34D] border-[2.5px] border-black px-4 py-2 shadow-[3px_3px_0px_0px_#000000] shrink-0">
                <span class="text-[13px] font-black uppercase tracking-[0.14em] text-black">
                    Countdown
                </span>
            </div>
        </header>

        <!-- 2 & 3. Hero (~45% height) + Overlapping Title Tag -->
        <section class="relative z-10 flex flex-col items-center justify-center my-auto">

            <!-- Swipeable Carousel Hero Stage -->
            <div class="relative w-[1080px] h-[540px] flex items-center justify-center">

                <!-- Left Peeking Card: H-4 -->
                <div class="absolute -left-[195px] w-[390px] h-[415px] bg-[#D6E6F4] border-[4px] border-black shadow-[8px_8px_0px_0px_#000000] flex items-center justify-end pr-8">
                    <span class="peek-hard-shadow text-[110px] font-black leading-none tracking-[-0.04em] text-[#1A467C]/60">
                        H-4
                    </span>
                </div>

                <!-- Decorative Geometric Corner Accents -->
                <div class="absolute top-[18px] left-[242px] w-11 h-11 bg-[#FCD34D] border-[3px] border-black shadow-[4px_4px_0px_0px_#000000] z-20"></div>
                <div class="absolute bottom-[132px] right-[242px] w-11 h-11 bg-[#2A82C6] border-[3px] border-black shadow-[4px_4px_0px_0px_#000000] z-20"></div>

                <!-- Center Hero Card: H-3 -->
                <div class="relative z-10 w-[530px] h-[520px] bg-[#1A467C] border-[5px] border-black shadow-[12px_12px_0px_0px_#000000] flex flex-col items-center justify-center pb-10">
                    <span class="h3-hard-shadow text-[208px] font-black leading-none tracking-[-0.04em] text-white">
                        H-3
                    </span>
                </div>

                <!-- Right Peeking Card: H-2 -->
                <div class="absolute -right-[195px] w-[390px] h-[415px] bg-[#D6E6F4] border-[4px] border-black shadow-[8px_8px_0px_0px_#000000] flex items-center justify-start pl-8">
                    <span class="peek-hard-shadow text-[110px] font-black leading-none tracking-[-0.04em] text-[#1A467C]/60">
                        H-2
                    </span>
                </div>
            </div>

            <!-- 3. Overlapping Title Tag (-2 deg rotation) -->
            <div class="relative z-20 -mt-[56px] -rotate-2 bg-white border-[4px] border-black shadow-[9px_9px_0px_0px_#000000] px-11 py-5 text-center max-w-[800px]">
                <span class="inline-block px-3.5 py-1 bg-[#FCD34D] border-2 border-black text-[14px] font-black uppercase tracking-[0.18em] text-black">
                    Kaderisasi
                </span>
                <h1 class="text-[40px] font-black uppercase leading-tight tracking-tight text-[#1A467C] mt-2">
                    [NAMA ACARA] 2026
                </h1>
            </div>

            <!-- 4. Tagline -->
            <div class="mt-9 px-7 py-3 bg-[#1A467C] border-[3px] border-black shadow-[5px_5px_0px_0px_#FCD34D] max-w-[760px]">
                <p class="text-center text-[22px] italic font-bold leading-snug text-white">
                    “[TAGLINE ACARA]”
                </p>
            </div>
        </section>

        <!-- 5. Info Card (2 columns) + 6. Footer -->
        <section class="relative z-10 w-full flex flex-col items-center gap-7">
            <div class="w-full max-w-[840px] bg-white border-[4px] border-black shadow-[8px_8px_0px_0px_#000000] px-9 py-5 grid grid-cols-[1fr_2px_1fr] items-center gap-8">

                <!-- Left: Calendar + Hari / Tanggal -->
                <div class="flex items-center gap-5 min-w-0">
                    <div class="w-[56px] h-[56px] bg-[#2A82C6] border-[3px] border-black shadow-[3px_3px_0px_0px_#000000] flex items-center justify-center shrink-0 text-white">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3" y="4" width="18" height="18" rx="1"></rect>
                            <path d="M16 2v4M8 2v4M3 10h18"></path>
                        </svg>
                    </div>
                    <div class="min-w-0">
                        <p class="text-[13px] font-black uppercase tracking-[0.14em] text-[#2A82C6] leading-tight">
                            [Hari]
                        </p>
                        <p class="text-[22px] font-black text-black leading-snug mt-0.5 truncate">
                            [Tanggal]
                        </p>
                    </div>
                </div>

                <!-- Solid Black Divider -->
                <div class="w-[2px] h-14 bg-black"></div>

                <!-- Right: Location Pin in Yellow Square + Lokasi / Tempat -->
                <div class="flex items-center gap-5 min-w-0">
                    <div class="w-[56px] h-[56px] bg-[#FCD34D] border-[3px] border-black shadow-[3px_3px_0px_0px_#000000] flex items-center justify-center shrink-0 text-black">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 21s-7-5.6-7-11a7 7 0 1 1 14 0c0 5.4-7 11-7 11Z"></path>
                            <circle cx="12" cy="10" r="2.5"></circle>
                        </svg>
                    </div>
                    <div class="min-w-0">
                        <p class="text-[13px] font-black uppercase tracking-[0.14em] text-[#2A82C6] leading-tight">
                            Lokasi
                        </p>
                        <p class="text-[22px] font-black text-black leading-snug mt-0.5 truncate">
                            [Tempat]
                        </p>
                    </div>
                </div>
            </div>

            <!-- 6. Footer -->
            <footer class="inline-flex items-center justify-center gap-5 bg-white border-[3px] border-black shadow-[4px_4px_0px_0px_#000000] px-7 py-2.5 text-[16px] font-extrabold text-[#1A467C]">
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5 shrink-0 text-black" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3" y="3" width="18" height="18" rx="3"></rect>
                        <circle cx="12" cy="12" r="4"></circle>
                        <circle cx="17.5" cy="6.5" r="1.1" fill="currentColor" stroke="none"></circle>
                    </svg>
                    <span>@[handle]</span>
                </div>

                <span class="w-2 h-2 bg-[#FCD34D] border border-black"></span>

                <span>hmif-lpkia.my.id</span>
            </footer>
        </section>

    </main>

</body>
</html>
