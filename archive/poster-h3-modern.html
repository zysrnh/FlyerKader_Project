<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown H-3 Kaderisasi — HIMA Informatika LPKIA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #12305A;
        }
        .poster-canvas {
            width: 1080px;
            height: 1350px;
            background: linear-gradient(155deg, #12305A 0%, #163D6E 50%, #1B4B82 100%);
        }
        .hero-card-glow {
            background: linear-gradient(160deg, #215794 0%, #1A467A 100%);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.22),
                inset 0 0 64px rgba(253, 211, 77, 0.10),
                0 28px 64px rgba(10, 26, 52, 0.45);
        }
        .h3-text-shadow {
            text-shadow: 7px 7px 0 rgba(253, 211, 77, 0.90);
        }
        .title-tag-shadow {
            box-shadow: 0 20px 44px rgba(10, 26, 52, 0.36);
        }
        .pill-shadow {
            box-shadow: 0 18px 42px rgba(10, 26, 52, 0.28);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#12305A]">

    <!-- Fixed 1080x1350 Portrait 4:5 Artboard -->
    <main class="poster-canvas relative overflow-hidden flex flex-col justify-between px-[72px] pt-[46px] pb-[48px] text-white select-none">

        <!-- Subtle Decorative Layer: Low-opacity blurred yellow glow orbs -->
        <div class="pointer-events-none absolute -top-24 -right-24 w-[460px] h-[460px] rounded-full bg-[#FDD34D]/[0.07] blur-[120px]"></div>
        <div class="pointer-events-none absolute top-[48%] -left-32 w-[420px] h-[420px] rounded-full bg-[#FDD34D]/[0.06] blur-[130px]"></div>
        <div class="pointer-events-none absolute -bottom-28 right-12 w-[380px] h-[380px] rounded-full bg-[#FDD34D]/[0.06] blur-[120px]"></div>

        <!-- 1. Header (~8% height / ~108px) -->
        <header class="relative z-10 h-[108px] flex items-center">
            <div class="w-14 h-14 rounded-2xl bg-white/10 border border-white/15 flex items-center justify-center p-2 shrink-0">
                <img
                    src="../assets/logo-hima.png"
                    alt="Logo HIMA Informatika"
                    class="w-full h-full object-contain"
                >
            </div>

            <div class="w-px h-10 bg-white/30 mx-5 shrink-0"></div>

            <div class="flex flex-col justify-center">
                <span class="text-[22px] font-bold leading-tight tracking-tight text-white">
                    HIMA Informatika
                </span>
                <span class="text-[14px] font-normal leading-tight text-white/80 mt-1">
                    Institut Digital Ekonomi LPKIA
                </span>
            </div>
        </header>

        <!-- 2 & 3. Hero (~45% height) + Overlapping Title Tag -->
        <section class="relative z-10 flex flex-col items-center justify-center my-auto">

            <!-- Swipeable Carousel Hero Stage -->
            <div class="relative w-[1080px] h-[540px] flex items-center justify-center">

                <!-- Left Peeking Card: H-4 (40% opacity, cropped on left edge) -->
                <div class="absolute -left-[195px] w-[390px] h-[420px] rounded-[28px] bg-[#1E528C]/55 border border-white/15 opacity-40 flex items-center justify-end pr-8">
                    <span class="text-[112px] font-extrabold leading-none tracking-[-0.04em] text-white">
                        H-4
                    </span>
                </div>

                <!-- Center Hero Card: H-3 -->
                <div class="hero-card-glow relative z-10 w-[530px] h-[530px] rounded-[32px] border border-white/15 flex items-center justify-center pb-8">
                    <span class="h3-text-shadow text-[208px] font-extrabold leading-none tracking-[-0.04em] text-white">
                        H-3
                    </span>
                </div>

                <!-- Right Peeking Card: H-2 (40% opacity, cropped on right edge) -->
                <div class="absolute -right-[195px] w-[390px] h-[420px] rounded-[28px] bg-[#1E528C]/55 border border-white/15 opacity-40 flex items-center justify-start pl-8">
                    <span class="text-[112px] font-extrabold leading-none tracking-[-0.04em] text-white">
                        H-2
                    </span>
                </div>
            </div>

            <!-- 3. Overlapping White Title Tag (-2 deg rotation) -->
            <div class="title-tag-shadow relative z-20 -mt-[54px] -rotate-2 bg-white rounded-[22px] px-12 py-5 text-center max-w-[780px]">
                <p class="text-[17px] font-medium uppercase tracking-[0.22em] text-[#1B4B82] leading-tight">
                    Kaderisasi
                </p>
                <h1 class="text-[42px] font-extrabold leading-tight tracking-tight text-[#12305A] mt-1">
                    [NAMA ACARA] 2026
                </h1>
            </div>

            <!-- 4. Tagline (centered italic white text, max 2 lines) -->
            <p class="mt-11 max-w-[740px] text-center text-[24px] italic font-normal leading-[1.45] text-white/90">
                “[TAGLINE ACARA]”
            </p>
        </section>

        <!-- 5. Info Pill (white 90% opacity, 2 columns) -->
        <section class="relative z-10 w-full flex flex-col items-center gap-8">
            <div class="pill-shadow w-full max-w-[820px] bg-white/90 rounded-[24px] px-10 py-6 grid grid-cols-[1fr_1px_1fr] items-center gap-8">

                <!-- Left: Calendar + Hari / Tanggal -->
                <div class="flex items-center gap-5 min-w-0">
                    <div class="w-[52px] h-[52px] rounded-full bg-[#12305A]/10 flex items-center justify-center shrink-0 text-[#12305A]">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3" y="4" width="18" height="18" rx="3"></rect>
                            <path d="M16 2v4M8 2v4M3 10h18"></path>
                        </svg>
                    </div>
                    <div class="min-w-0">
                        <p class="text-[14px] font-medium uppercase tracking-[0.12em] text-[#1B4B82]/80 leading-tight">
                            [Hari]
                        </p>
                        <p class="text-[21px] font-bold text-[#12305A] leading-snug mt-0.5 truncate">
                            [Tanggal]
                        </p>
                    </div>
                </div>

                <!-- Thin Vertical Divider -->
                <div class="w-px h-12 bg-[#12305A]/15"></div>

                <!-- Right: Location Pin in Yellow Circle + Lokasi / Tempat -->
                <div class="flex items-center gap-5 min-w-0">
                    <div class="w-[52px] h-[52px] rounded-full bg-[#FDD34D] flex items-center justify-center shrink-0 text-[#12305A]">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 21s-7-5.6-7-11a7 7 0 1 1 14 0c0 5.4-7 11-7 11Z"></path>
                            <circle cx="12" cy="10" r="2.5"></circle>
                        </svg>
                    </div>
                    <div class="min-w-0">
                        <p class="text-[14px] font-medium uppercase tracking-[0.12em] text-[#1B4B82]/80 leading-tight">
                            Lokasi
                        </p>
                        <p class="text-[21px] font-bold text-[#12305A] leading-snug mt-0.5 truncate">
                            [Tempat]
                        </p>
                    </div>
                </div>
            </div>

            <!-- 6. Footer (Instagram handle + optional website) -->
            <footer class="flex items-center justify-center gap-5 text-[16px] font-normal text-white/85">
                <div class="flex items-center gap-2.5">
                    <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                        <circle cx="12" cy="12" r="4"></circle>
                        <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle>
                    </svg>
                    <span>@[handle]</span>
                </div>

                <span class="w-1 h-1 rounded-full bg-[#FDD34D]"></span>

                <span>hmif-lpkia.my.id</span>
            </footer>
        </section>

    </main>

</body>
</html>
